# SSH out of a sandbox: there's no DNS and no route out but the egress proxy, and ssh doesn't read HTTPS_PROXY, so
# kantel-connect (the guest agent) opens the connection through the proxy with an HTTP CONNECT. Your own
# ~/.ssh/config is read first and wins for anything it sets. To reach another host the same way, add to it:
#
#   Host gitlab.com
#       ProxyCommand /usr/local/bin/kantel-connect %h %p
#
# GitHub over SSH goes to ssh.github.com on port 443, where GitHub serves SSH for networks that allow only HTTPS's
# port; its host keys are in /etc/ssh/ssh_known_hosts, under github.com (HostKeyAlias), as GitHub publishes them.
Host github.com
	HostName ssh.github.com
	Port 443
	HostKeyAlias github.com
	ProxyCommand /usr/local/bin/kantel-connect %h %p
