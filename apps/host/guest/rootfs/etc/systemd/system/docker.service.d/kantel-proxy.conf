# The sandbox's egress proxy, for image pulls too: the guest agent's local forwarder (internal/guest/proxy.go), which
# follows the sandbox's proxy through forks and restores, so dockerd never restarts for it.
[Service]
Environment=HTTP_PROXY=http://127.0.0.1:3128 HTTPS_PROXY=http://127.0.0.1:3128 NO_PROXY=localhost,127.0.0.1,::1
