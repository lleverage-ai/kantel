# sshd starts only once the sandbox has its host key: the template a sandbox is restored from has none (the guest
# agent writes one on every create and fork, then starts this unit). Without the condition, sshd fails at boot and
# its unit can be left failed. Not socket-activated: a readiness probe on port 22 would start sshd in a template.
[Unit]
ConditionPathExists=/etc/ssh/ssh_host_ed25519_key
