# Every systemd service gets the sandbox's egress proxy and CA bundle (lleverage-ai/kantel#730): a sandbox has no DNS
# and no route out but the proxy, so a service without these has no network. The proxy is the guest agent's forwarder
# (internal/guest/proxy.go), as dockerd's is, which follows the sandbox's proxy through forks and restores: nothing
# here goes stale, so no service restarts for it. The same values are in /etc/environment, for PAM sessions.
# A sandbox's own variables (kantel new -e) aren't here: a unit that wants them adds EnvironmentFile=-/etc/kantel/env.
[Manager]
DefaultEnvironment="HTTP_PROXY=http://127.0.0.1:3128" "HTTPS_PROXY=http://127.0.0.1:3128" "http_proxy=http://127.0.0.1:3128" "https_proxy=http://127.0.0.1:3128" "NO_PROXY=localhost,127.0.0.1,::1" "no_proxy=localhost,127.0.0.1,::1" "NODE_USE_ENV_PROXY=1" "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt"
