[geany]
geometry=320;120;1280;800;0
treeview_position=260
beep_on_errors=false
pref_main_confirm_exit=false
editor_font=DejaVu Sans Mono 11
tagbar_font=DejaVu Sans 10
msgwin_font=DejaVu Sans Mono 10
show_linenumber_margin=true
show_indent_guide=true
long_line_enabled=true
long_line_column=100
line_break_column=100
color_scheme=one-dark.conf
sidebar_visible=true
sidebar_symbol_visible=false
sidebar_openfiles_visible=false
msgwindow_visible=false
statusbar_visible=true
pref_toolbar_show=true
pref_editor_tab_width=4
pref_editor_trail_space=true
pref_editor_ensure_convert_line_endings=true
pref_editor_new_line=true
pref_template_developer=user

[tools]
terminal_cmd=lxterminal -e /bin/sh %c

[plugins]
load_plugins=true
custom_plugin_path=
active_plugins=/usr/lib/@MULTIARCH@/geany/filebrowser.so;
