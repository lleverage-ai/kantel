# Kantel's own browsers on Kubernetes (packages/browser/CONTRACT.md): the self-hosted browser host
# (apps/selfhosted/src/browser/host.ts) with KANTEL_BROWSER_DRIVER=kubernetes, starting one Pod of images/browser per
# browser in this namespace. See README.md beside this file.
#
#   kubectl create namespace kantel-browsers
#   kubectl -n kantel-browsers create secret generic kantel-browser-host \
#     --from-literal=KANTEL_BROWSER_HOST_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=KANTEL_BROWSER_VIEW_KEY="$(openssl rand -hex 32)" \
#     --from-literal=KANTEL_BROWSER_SEAL_KEY="$(openssl rand -hex 32)"
#   kubectl apply -k deploy/kubernetes/browser-host
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbour-browsers
resources:
  - rbac.yaml
  - host.yaml
  - network-policy.yaml
images:
  # Built from apps/selfhosted/Dockerfile and images/browser; push both where the cluster pulls from.
  - name: harbour-selfhosted
    newName: harbour-selfhosted
    newTag: dev
labels:
  - pairs:
      app.kubernetes.io/part-of: harbour
    includeSelectors: false
