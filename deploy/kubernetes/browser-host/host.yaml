# The browser host: one replica, as it keeps its browsers' state in memory (a restart forgets them and its janitor
# removes their Pods; the gateway's leases end with its sessions anyway). Profiles and recordings are on the volume,
# sealed with HARBOUR_BROWSER_SEAL_KEY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbour-browser-host
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: harbour-browser-host }
  template:
    metadata:
      labels: { app.kubernetes.io/name: harbour-browser-host }
    spec:
      serviceAccountName: harbour-browser-host
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: host
          image: harbour-selfhosted
          command: ["bun", "src/browser/host.ts"]
          ports: [{ name: http, containerPort: 8790 }]
          env:
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "8790" }
            - { name: HARBOUR_BROWSER_DRIVER, value: kubernetes }
            # The browser image, as the cluster pulls it.
            - { name: HARBOUR_BROWSER_IMAGE, value: harbour-browser:dev }
            - { name: HARBOUR_BROWSER_STACK, value: harbour }
            - { name: HARBOUR_BROWSER_DATA_DIR, value: /var/lib/harbour-browser }
            - { name: HARBOUR_BROWSER_MEMORY_MB, value: "2048" }
            - { name: HARBOUR_BROWSER_CPUS, value: "1" }
            - { name: HARBOUR_BROWSER_RECORDING_DAYS, value: "7" }
            # With gVisor's RuntimeClass installed, Chromium runs under it as well as its own sandbox.
            # - { name: HARBOUR_BROWSER_RUNTIME_CLASS, value: gvisor }
          envFrom:
            - secretRef: { name: harbour-browser-host }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - { name: data, mountPath: /var/lib/harbour-browser }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: harbour-browser-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbour-browser-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
# The gateway calls it here: HARBOUR_BROWSER_HOST_URL=http://harbour-browser-host.harbour-browsers.svc:8790
apiVersion: v1
kind: Service
metadata:
  name: harbour-browser-host
spec:
  selector: { app.kubernetes.io/name: harbour-browser-host }
  ports: [{ name: http, port: 8790, targetPort: http }]
