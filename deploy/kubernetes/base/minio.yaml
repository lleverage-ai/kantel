# S3 for workspace trees. Chainguard's build of the MinIO server, pinned by digest as in compose.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: harbour-s3, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: harbour-s3, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
