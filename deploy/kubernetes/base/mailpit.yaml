# The SMTP server sign-in codes go to (#15, email one-time PIN), as in compose and CI. Keeps every message in memory,
# never relays anything on, and serves them on port 8025 (web UI and API). In production, point HARBOUR_SMTP_URL in
# gateway.yaml at a real relay and leave this out.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
          env:
            - { name: MP_MAX_MESSAGES, value: "500" }
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true" }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 32Mi }
