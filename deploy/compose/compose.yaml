# Kantel self-hosted, on one machine (the self-hosted spike).
#
#   docker compose -f deploy/compose/compose.yaml up -d --build --wait
#
# Two session hosts (host-a, host-b) share one Postgres lease table, so killing
# one moves its sessions to the other within a lease TTL. Each sandbox
# container gets its own internal network, created per command, whose only
# other member is the vault proxy: nothing a sandbox sends can leave except
# through the vault, and no sandbox can reach another.
#
# Runtimes: KANTEL_ISOLATE_RUNTIME and KANTEL_SANDBOX_RUNTIME pick the OCI
# runtime for the workerd isolate host and for sandbox containers. Both
# default to runc; set them to runsc-kvm (bare metal) or runsc (in a VM) once
# gVisor is registered with the Docker daemon (see README.md). Production must
# not run workerd on runc.
#
# gVisor cannot reach Docker's embedded DNS (127.0.0.11) on a user-defined
# network (https://gvisor.dev/docs/user_guide/faq/), so anything that may run
# on runsc finds its peers by address, not by name: minio and vault-proxy have
# fixed addresses on `control` (KANTEL_CONTROL_PREFIX, default 10.250.89),
# and the isolate host gets them as /etc/hosts entries.
#
# The isolate host has a fixed address too, for a different reason: the session
# hosts (Bun) cache DNS answers for 30 s, so if the isolate host is recreated
# on a new address, a host that isn't recreated with it keeps calling the old
# one. Docker hands out the other addresses on `control` from .128 up, so they
# can never take a fixed one.
#
# `gateway` serves the APIs (sessions, workspace reads, audit queries)
# behind the API-key authenticator, and the console, on KANTEL_GATEWAY_PORT
# (default 58090). The spike's session hosts and their API are unchanged.
# Its sessions' `bash` runs in an in-process isolate, and `git`, `node`,
# `python3` and anything else the isolate doesn't have in a container of the
# sandbox image (tier 2): one per session, on an internal network of its own
# whose only other member is the vault proxy, as the hosts' are. Its runtime
# is KANTEL_SANDBOX_RUNTIME when set, else runsc when the daemon has gVisor
# registered, else runc.
#
# Sessions get Kantel's own browsers (packages/browser/CONTRACT.md):
# `browser-host` runs one Chromium container of `browser-image` per browser,
# and the console shows each one live and plays it back. An agent asks before
# it opens any site; a person allows or declines it in the console.
# KANTEL_BROWSER_PROVIDER=off starts the gateway without them, and `brwsr`
# (with KANTEL_BRWSR_API_KEY) uses brwsr.dev instead.
#
# A second stack beside this one (another lane's, or CI's) needs its own
# project name, ports, control prefix, vault container name, sandbox network
# prefix and image tag; see README.md, "Running a second stack".

name: harbour

x-host: &host
  build:
    context: ../..
    dockerfile: apps/selfhosted/Dockerfile
  image: harbour-selfhosted:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    minio: { condition: service_healthy }
    isolate-host: { condition: service_healthy }
    vault-proxy: { condition: service_healthy }
    sandbox-image: { condition: service_completed_successfully }
  networks: [control]
  volumes:
    # The container runner starts sandboxes through the Docker API. Anything
    # holding this socket is root on the machine: a spike-only shortcut, see
    # README.md for the production shape.
    - ${KANTEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
  healthcheck:
    test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/healthz'); process.exit(r.ok ? 0 : 1)"]
    interval: 2s
    timeout: 2s
    retries: 30
  environment: &host-env
    KANTEL_DATABASE_URL: postgres://harbour:harbour@postgres:5432/harbour
    KANTEL_LEASE_TTL_MS: ${KANTEL_LEASE_TTL_MS:-${HARBOUR_LEASE_TTL_MS:-10000}}
    KANTEL_IDLE_CLOSE_MS: ${KANTEL_IDLE_CLOSE_MS:-${HARBOUR_IDLE_CLOSE_MS:-300000}}
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: harbour
    S3_ACCESS_KEY: harbour
    S3_SECRET_KEY: harbour-dev-secret
    KANTEL_ISOLATE_URL: http://isolate-host:8080
    KANTEL_SANDBOX_IMAGE: harbour-sandbox:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    KANTEL_SANDBOX_RUNTIME: ${KANTEL_SANDBOX_RUNTIME:-${HARBOUR_SANDBOX_RUNTIME:-runc}}
    # Recorded by src/measure.ts beside its numbers.
    KANTEL_ISOLATE_RUNTIME: ${KANTEL_ISOLATE_RUNTIME:-${HARBOUR_ISOLATE_RUNTIME:-runc}}
    # Name prefix of the per-command sandbox networks.
    KANTEL_SANDBOX_NETWORK: ${KANTEL_SANDBOX_NETWORK:-${HARBOUR_SANDBOX_NETWORK:-harbour-sbx}}
    KANTEL_VAULT_CONTAINER: ${KANTEL_VAULT_CONTAINER:-${HARBOUR_VAULT_CONTAINER:-harbour-vault-proxy}}
    KANTEL_VAULT_PROXY_URL: http://vault-proxy:3128
    KANTEL_SPIKE_TOKEN: ${KANTEL_SPIKE_TOKEN:-${HARBOUR_SPIKE_TOKEN:-}}

services:
  # Every long-running service restarts with the Docker daemon, so the stack
  # comes back whole after the machine reboots (#231). Without it the session
  # hosts and gateway came back on their own while Postgres and MinIO stayed
  # stopped.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: harbour
      POSTGRES_DB: harbour
    ports: ["127.0.0.1:${KANTEL_PG_PORT:-${HARBOUR_PG_PORT:-55432}}:5432"]
    networks: [control]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "harbour"]
      interval: 1s
      timeout: 2s
      retries: 30

  minio:
    # MinIO no longer publishes images to Docker Hub or Quay; Chainguard's
    # build of the same server is public. Pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: harbour
      MINIO_ROOT_PASSWORD: harbour-dev-secret
    ports: ["127.0.0.1:${KANTEL_S3_PORT:-${HARBOUR_S3_PORT:-59000}}:9000"]
    networks:
      control: { ipv4_address: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.10" }
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 2s
      timeout: 2s
      retries: 30

  isolate-host:
    build:
      context: ../..
      dockerfile: images/isolate-host/Dockerfile
    image: harbour-isolate-host:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    runtime: ${KANTEL_ISOLATE_RUNTIME:-${HARBOUR_ISOLATE_RUNTIME:-runc}}
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: harbour
      S3_ACCESS_KEY: harbour
      S3_SECRET_KEY: harbour-dev-secret
      VAULT_ISOLATE_KEY: ${KANTEL_VAULT_ISOLATE_KEY:-${HARBOUR_VAULT_ISOLATE_KEY:-dev-isolate-key}}
    ports: ["127.0.0.1:${KANTEL_ISOLATE_PORT:-${HARBOUR_ISOLATE_PORT:-58080}}:8080"]
    networks:
      control: { ipv4_address: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.12" }
    # By address: on runsc this container cannot use Docker's DNS.
    extra_hosts:
      - "minio:${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.10"
      - "vault-proxy:${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.11"
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      # No shell tools in the image beyond bash's /dev/tcp.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3",
        ]
      interval: 1s
      timeout: 2s
      retries: 30

  vault-proxy:
    build:
      context: ../..
      dockerfile: apps/vault-proxy/Dockerfile
    image: harbour-vault-proxy:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    # Fixed, because session hosts and the gateway connect it to each sandbox
    # network by name.
    container_name: ${KANTEL_VAULT_CONTAINER:-${HARBOUR_VAULT_CONTAINER:-harbour-vault-proxy}}
    restart: unless-stopped
    environment:
      KANTEL_DATABASE_URL: postgres://harbour:harbour@postgres:5432/harbour
      VAULT_POLICY: /etc/harbour/vault-policy.json
      VAULT_ISOLATE_KEY: ${KANTEL_VAULT_ISOLATE_KEY:-${HARBOUR_VAULT_ISOLATE_KEY:-dev-isolate-key}}
      # The canary: injected by the vault, required by the research fixture,
      # and checked to appear nowhere in sandboxes, transcripts or logs.
      KANTEL_CANARY_SECRET: ${KANTEL_CANARY_SECRET:-${HARBOUR_CANARY_SECRET:-harbour-canary-0000}}
    volumes:
      - ./vault-policy.json:/etc/harbour/vault-policy.json:ro
      # The CA the vault intercepts sandbox HTTPS with; kept so sandboxes
      # trust the same CA across vault restarts. Only the vault mounts it.
      - vaultca:/var/lib/harbour-vault
    networks:
      control: { ipv4_address: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.11" }
      upstream: {}
    depends_on:
      postgres: { condition: service_healthy }
      host-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3128/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 1s
      timeout: 2s
      retries: 30

  research-site:
    image: oven/bun:1.3.14-alpine
    command: ["bun", "/srv/server.ts"]
    restart: unless-stopped
    environment:
      KANTEL_CANARY_SECRET: ${KANTEL_CANARY_SECRET:-${HARBOUR_CANARY_SECRET:-harbour-canary-0000}}
      PORT: "80"
    volumes:
      - ../../spike/fixtures/research-site/server.ts:/srv/server.ts:ro
    networks: [upstream]

  # Builds the sandbox image, then exits. Session hosts and the gateway start
  # containers from it.
  sandbox-image:
    build:
      context: ../../images/sandbox
    image: harbour-sandbox:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["true"]
    restart: "no"
    network_mode: none

  # Applies sql/ once before anything uses the tables.
  host-migrate:
    <<: *host
    command: ["bun", "src/main.ts", "migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    volumes: []
    healthcheck: { disable: true }

  # The gateway: the session, workspace read and audit APIs, email one-time
  # PIN sign-in, and the console. It writes its bootstrap organisation,
  # project, workspace and API key to KANTEL_BOOTSTRAP_FILE.
  gateway:
    build:
      context: ../..
      dockerfile: apps/selfhosted/Dockerfile
    image: harbour-selfhosted:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["bun", "src/gateway/main.ts"]
    restart: unless-stopped
    environment:
      KANTEL_BOOTSTRAP_FILE: /var/lib/harbour/bootstrap.json
      KANTEL_CONSOLE_DIR: /harbour/apps/console/dist
      # Where sign-in codes are sent (#15, email one-time PIN): Mailpit here,
      # in the clear on the private network (starttls=off); any relay in
      # production (smtp:// with STARTTLS required, or smtps://).
      KANTEL_SMTP_URL: ${KANTEL_SMTP_URL:-${HARBOUR_SMTP_URL:-smtp://mailpit:1025?starttls=off}}
      KANTEL_MAIL_FROM: ${KANTEL_MAIL_FROM:-${HARBOUR_MAIL_FROM:-Kantel <harbour@harbour.localhost>}}
      # Invited as an organisation admin, so someone can sign in: Kantel is
      # invite-only. Its codes land in Mailpit.
      KANTEL_ADMIN_EMAIL: ${KANTEL_ADMIN_EMAIL:-${HARBOUR_ADMIN_EMAIL:-admin@harbour.localhost}}
      # The real components (#18 step 3): runtime, audit, identity,
      # workspaces, skills and memory (#12) on this Postgres, in their own
      # schema apart from the session hosts' `kantel`, with workspace trees and skill files
      # in MinIO under prefixes of their own.
      KANTEL_DATABASE_URL: postgres://harbour:harbour@postgres:5432/harbour
      KANTEL_GATEWAY_SCHEMA: harbour_m1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: harbour
      S3_ACCESS_KEY: harbour
      S3_SECRET_KEY: harbour-dev-secret
      KANTEL_GATEWAY_S3_PREFIX: m1/workspaces/
      KANTEL_SKILLS_S3_PREFIX: m1/skills/
      # More projects beside the first, by name (comma-separated), all on
      # the bootstrap's operator key; next-to-sal.yaml names a default set.
      KANTEL_PROJECTS: ${KANTEL_PROJECTS:-${HARBOUR_PROJECTS:-}}
      # The vault's key, made at the first start and kept on the gateway's
      # volume, so the console's first-run setup can keep the keys of the
      # model providers you connect (CLI Proxy API, LiteLLM, Cloudflare AI
      # Gateway, OpenRouter). KANTEL_VAULT_CIPHER_KEY, where set, wins.
      KANTEL_VAULT_CIPHER_KEY_FILE: /var/lib/harbour/vault-cipher.key
      # Connections (outside services and MCP servers people connect, with
      # the connection tools in every session, as on Cloudflare): OAuth
      # providers send a person back to the console here. Set
      # KANTEL_PUBLIC_URL instead behind a TLS proxy; `KANTEL_CONNECTIONS=off`
      # turns them off.
      KANTEL_PUBLIC_URL: ${KANTEL_PUBLIC_URL:-}
      KANTEL_CONNECTIONS: ${KANTEL_CONNECTIONS:-}
      KANTEL_CONNECTIONS_ORIGIN: ${KANTEL_CONNECTIONS_ORIGIN:-http://127.0.0.1:${KANTEL_GATEWAY_PORT:-${HARBOUR_GATEWAY_PORT:-58090}}}
      # Each `off` takes a default tool away (apps/selfhosted/src/gateway/session-tools.ts):
      # `codemode`, saved programs (`save_program`, /v1/programs) and their
      # pauses, `present_files` and `create_document`. On otherwise, as on
      # Cloudflare's deployment.
      KANTEL_CODEMODE: ${KANTEL_CODEMODE:-}
      KANTEL_PROGRAMS: ${KANTEL_PROGRAMS:-}
      KANTEL_PROGRAM_WAITS: ${KANTEL_PROGRAM_WAITS:-}
      KANTEL_PRESENT_FILES: ${KANTEL_PRESENT_FILES:-}
      # The sessions' browsers, on `browser-host` (src/gateway/browser.ts). The
      # gateway calls the host with its token, and passes a viewer's live view
      # and replay (`/v1/browser/view/...`) on to it only with a view token
      # signed with the view key, which both hold.
      KANTEL_BROWSER_PROVIDER: ${KANTEL_BROWSER_PROVIDER:-${HARBOUR_BROWSER_PROVIDER:-kantel}}
      KANTEL_BROWSER_HOST_URL: http://browser-host:8790
      KANTEL_BROWSER_HOST_TOKEN: ${KANTEL_BROWSER_HOST_TOKEN:-${HARBOUR_BROWSER_HOST_TOKEN:-dev-browser-host-token-0000000000000000}}
      KANTEL_BROWSER_VIEW_KEY: ${KANTEL_BROWSER_VIEW_KEY:-${HARBOUR_BROWSER_VIEW_KEY:-dev-browser-view-key-00000000000000000000}}
      KANTEL_BRWSR_API_KEY: ${KANTEL_BRWSR_API_KEY:-${HARBOUR_BRWSR_API_KEY:-}}
      # (KANTEL_PUBLIC_URL, above, also makes an embed link absolute.)
      KANTEL_EMBED_ORIGINS: ${KANTEL_EMBED_ORIGINS:-${HARBOUR_EMBED_ORIGINS:-}}
      # The container tier (tier 2): sessions' `git`, `node`, `python3` and
      # the rest run in containers of the sandbox image, started through the
      # Docker socket below. `auto`: runsc (gVisor) when the daemon has it
      # registered, runc otherwise; KANTEL_SANDBOX_RUNTIME picks one outright
      # (runsc-kvm on bare metal). KANTEL_SANDBOX_CONTAINERS=off turns the
      # tier off: such commands are then refused.
      KANTEL_SANDBOX_CONTAINERS: ${KANTEL_SANDBOX_CONTAINERS:-docker}
      KANTEL_SANDBOX_IMAGE: harbour-sandbox:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
      KANTEL_SANDBOX_RUNTIME: ${KANTEL_SANDBOX_RUNTIME:-${HARBOUR_SANDBOX_RUNTIME:-auto}}
      # Each session's container gets an internal network of its own, named
      # from this prefix, whose only other member is the vault proxy: its only
      # way out, as the hosts' sandboxes'.
      KANTEL_SANDBOX_NETWORK: ${KANTEL_SANDBOX_NETWORK:-${HARBOUR_SANDBOX_NETWORK:-harbour-sbx}}-gw
      KANTEL_VAULT_CONTAINER: ${KANTEL_VAULT_CONTAINER:-${HARBOUR_VAULT_CONTAINER:-harbour-vault-proxy}}
      KANTEL_VAULT_PROXY_URL: http://vault-proxy:3128
      # Its containers' labels, which its janitor removes leftovers by: one
      # prefix per stack, so stacks sharing a daemon leave each other's alone.
      KANTEL_SANDBOX_LABEL_PREFIX: kantel-gateway.${COMPOSE_PROJECT_NAME}
    ports: ["127.0.0.1:${KANTEL_GATEWAY_PORT:-${HARBOUR_GATEWAY_PORT:-58090}}:8080"]
    networks: [control]
    volumes:
      - gatewaystate:/var/lib/harbour
      # The container tier starts sandboxes through the Docker API: anything
      # holding this socket is root on the machine (see README.md). The
      # installer sets KANTEL_DOCKER_SOCKET_PATH for rootless Docker.
      - ${KANTEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    # A provider on this machine, such as CLIProxyAPI on :8317 or LiteLLM on
    # :4000, is http://host.docker.internal:<port>/v1 from the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      browser-host: { condition: service_healthy }
      # The container tier's image, and the table of the tokens the vault
      # proxy knows each container by. Not the proxy itself: a container
      # reaches it only when a command runs, and egress-vault.yaml has the
      # proxy wait for the gateway.
      host-migrate: { condition: service_completed_successfully }
      sandbox-image: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Builds the browser image (images/browser: Chromium and its agent), then
  # exits. The browser host starts containers from it.
  browser-image:
    build:
      context: ../../images/browser
    image: harbour-browser:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["true"]
    restart: "no"
    network_mode: none

  # The sessions' browsers (src/browser/host.ts): one container of the browser
  # image per browser, started through the Docker socket on the `browsers`
  # network, with each browser's profile and recording on its volume, sealed
  # with KANTEL_BROWSER_SEAL_KEY. Like the session hosts, anything holding the
  # Docker socket is root on the machine: see README.md, "Kantel's own
  # browsers". The browsers reach the internet from `browsers`, where nothing
  # else is but this host; only the agent's port answers, and only to the
  # host's per-start token.
  #
  # The keys are development defaults, like the passwords above. Anywhere but
  # your own machine, set KANTEL_BROWSER_HOST_TOKEN, KANTEL_BROWSER_VIEW_KEY and
  # KANTEL_BROWSER_SEAL_KEY to random values of 32 characters or more
  # (`openssl rand -hex 32`), and keep the seal key: profiles sealed with one
  # don't open with another.
  browser-host:
    build:
      context: ../..
      dockerfile: apps/selfhosted/Dockerfile
    image: harbour-selfhosted:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["bun", "src/browser/host.ts"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      KANTEL_BROWSER_HOST_TOKEN: ${KANTEL_BROWSER_HOST_TOKEN:-${HARBOUR_BROWSER_HOST_TOKEN:-dev-browser-host-token-0000000000000000}}
      KANTEL_BROWSER_VIEW_KEY: ${KANTEL_BROWSER_VIEW_KEY:-${HARBOUR_BROWSER_VIEW_KEY:-dev-browser-view-key-00000000000000000000}}
      KANTEL_BROWSER_SEAL_KEY: ${KANTEL_BROWSER_SEAL_KEY:-${HARBOUR_BROWSER_SEAL_KEY:-dev-browser-seal-key-00000000000000000000}}
      KANTEL_BROWSER_DATA_DIR: /var/lib/harbour-browser
      KANTEL_BROWSER_IMAGE: harbour-browser:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
      # Names this stack's browser containers, so its janitor removes only its own on a shared daemon.
      KANTEL_BROWSER_STACK: ${COMPOSE_PROJECT_NAME:-harbour}
      KANTEL_BROWSER_NETWORK: ${KANTEL_BROWSER_NETWORK:-${HARBOUR_BROWSER_NETWORK:-harbour-browsers}}
      KANTEL_BROWSER_RUNTIME: ${KANTEL_BROWSER_RUNTIME:-${HARBOUR_BROWSER_RUNTIME:-runc}}
      KANTEL_BROWSER_MEMORY_MB: ${KANTEL_BROWSER_MEMORY_MB:-${HARBOUR_BROWSER_MEMORY_MB:-2048}}
      KANTEL_BROWSER_CPUS: ${KANTEL_BROWSER_CPUS:-${HARBOUR_BROWSER_CPUS:-1}}
      KANTEL_BROWSER_RECORDING_DAYS: ${KANTEL_BROWSER_RECORDING_DAYS:-${HARBOUR_BROWSER_RECORDING_DAYS:-7}}
      KANTEL_BROWSER_CONSENT: ${KANTEL_BROWSER_CONSENT:-${HARBOUR_BROWSER_CONSENT:-on}}
    networks: [control, browsers]
    volumes:
      # As the gateway's: KANTEL_DOCKER_SOCKET_PATH for rootless Docker.
      - ${KANTEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - browserdata:/var/lib/harbour-browser
    depends_on:
      browser-image: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8790/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The SMTP server sign-in codes go to in compose and CI. It keeps every
  # message in memory and serves them at http://127.0.0.1:58025 (web UI and
  # API), where end-to-end tests read the codes. Never relays anything on.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${KANTEL_MAILPIT_PORT:-${HARBOUR_MAILPIT_PORT:-58025}}:8025"
      - "127.0.0.1:${KANTEL_SMTP_PORT:-${HARBOUR_SMTP_PORT:-58125}}:1025"
    networks: [control]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 2s
      retries: 30

  host-a:
    <<: *host
    environment:
      <<: *host-env
      KANTEL_HOST_ID: host-a
      KANTEL_HOST_URL: http://host-a:8080
    ports: ["127.0.0.1:${KANTEL_HOST_A_PORT:-${HARBOUR_HOST_A_PORT:-58081}}:8080"]

  host-b:
    <<: *host
    environment:
      <<: *host-env
      KANTEL_HOST_ID: host-b
      KANTEL_HOST_URL: http://host-b:8080
    ports: ["127.0.0.1:${KANTEL_HOST_B_PORT:-${HARBOUR_HOST_B_PORT:-58082}}:8080"]

networks:
  control:
    ipam:
      config:
        - subnet: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.0/24"
          # Dynamic addresses only; .10-.12 are fixed above.
          ip_range: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.128/25"
  upstream: {}
  browsers:
    # Named outright: the browser host joins each browser container to it by this name.
    name: ${KANTEL_BROWSER_NETWORK:-${HARBOUR_BROWSER_NETWORK:-harbour-browsers}}

volumes:
  pgdata: {}
  miniodata: {}
  vaultca: {}
  gatewaystate: {}
  browserdata: {}
