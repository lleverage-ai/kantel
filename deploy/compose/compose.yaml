# Kantel self-hosted, on one machine.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build --wait --remove-orphans
#
# `gateway` serves the console and the compute plane's API (sandboxes,
# snapshots, keys, webhooks and hosts) on KANTEL_GATEWAY_PORT (default 58090),
# with Kantel's identity: email one-time PIN sign-in, organisations, projects
# and API keys. Its identity, sign-in codes, audit log and registry of hosts
# are in Postgres; sign-in codes go to Mailpit.
#
# Sandboxes run on hosts: Linux machines running the Kantel host agent
# (kantel-host), which you add from the console's Hosts page. A host dials out
# to the gateway, at its local address here by default (so a host on this
# machine can join) or at KANTEL_PUBLIC_URL when set, for hosts elsewhere.
#
# Upgrading from a version with the agent plane (sessions, models,
# connections, the vault, browsers): its services are gone from this file, so
# `--remove-orphans` (the installer passes it) stops and removes their
# containers. Their data is not touched: the agent plane's tables stay in
# Postgres, unused, and its volumes (miniodata, vaultca, browserdata) stay
# until you remove them yourself. See README.md, "Upgrading from the agent
# plane".
#
# A second stack beside this one (another lane's, or CI's) needs its own
# project name, ports, control prefix and image tag; see README.md, "Running a
# second stack".

name: harbour

services:
  # Every long-running service restarts with the Docker daemon, so the stack
  # comes back whole after the machine reboots (#231).
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: harbour
      POSTGRES_DB: harbour
    ports: ["127.0.0.1:${KANTEL_PG_PORT:-${HARBOUR_PG_PORT:-55432}}:5432"]
    networks: [control]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "harbour"]
      interval: 1s
      timeout: 2s
      retries: 30

  # The gateway: the console, the compute plane's API and its hosts, email
  # one-time PIN sign-in, identity and audit. It writes its bootstrap
  # organisation, project and keys, the compute plane's super-admin key among
  # them, to KANTEL_BOOTSTRAP_FILE.
  gateway:
    build:
      context: ../..
      dockerfile: apps/selfhosted/Dockerfile
    image: harbour-selfhosted:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["bun", "src/gateway/main.ts"]
    restart: unless-stopped
    environment:
      KANTEL_BOOTSTRAP_FILE: /var/lib/harbour/bootstrap.json
      KANTEL_CONSOLE_DIR: /harbour/apps/console/dist
      # Where sign-in codes are sent (#15, email one-time PIN): Mailpit here,
      # in the clear on the private network (starttls=off); any relay in
      # production (smtp:// with STARTTLS required, or smtps://).
      KANTEL_SMTP_URL: ${KANTEL_SMTP_URL:-${HARBOUR_SMTP_URL:-smtp://mailpit:1025?starttls=off}}
      KANTEL_MAIL_FROM: ${KANTEL_MAIL_FROM:-${HARBOUR_MAIL_FROM:-Kantel <harbour@harbour.localhost>}}
      # Invited as an organisation admin, so someone can sign in: Kantel is
      # invite-only. Its codes land in Mailpit.
      KANTEL_ADMIN_EMAIL: ${KANTEL_ADMIN_EMAIL:-${HARBOUR_ADMIN_EMAIL:-admin@harbour.localhost}}
      # Identity, sign-in, audit and the registry of hosts, in this schema.
      KANTEL_DATABASE_URL: postgres://harbour:harbour@postgres:5432/harbour
      KANTEL_GATEWAY_SCHEMA: harbour_m1
      # More projects beside the first, by name (comma-separated), all on
      # the bootstrap's operator key.
      KANTEL_PROJECTS: ${KANTEL_PROJECTS:-${HARBOUR_PROJECTS:-}}
      # Where people reach the console, such as https://kantel.example.com
      # behind a TLS proxy: invites link to it, and hosts on other machines
      # reach the gateway there.
      KANTEL_PUBLIC_URL: ${KANTEL_PUBLIC_URL:-}
      # Sign-in with GitHub and Google beside email codes: an OAuth client
      # of each, made by you, with its callback at
      # KANTEL_PUBLIC_URL/auth/oauth/<github|google>/callback. A provider
      # is on with both its ID and secret and KANTEL_PUBLIC_URL; empty, off.
      # Invite-only as email codes are.
      KANTEL_GITHUB_CLIENT_ID: ${KANTEL_GITHUB_CLIENT_ID:-}
      KANTEL_GITHUB_CLIENT_SECRET: ${KANTEL_GITHUB_CLIENT_SECRET:-}
      KANTEL_GOOGLE_CLIENT_ID: ${KANTEL_GOOGLE_CLIENT_ID:-}
      KANTEL_GOOGLE_CLIENT_SECRET: ${KANTEL_GOOGLE_CLIENT_SECRET:-}
      # The compute plane's API (@kantel/compute), which the console runs
      # on: sandboxes, snapshots, scoped keys, webhooks and hosts under /v1,
      # its records in memory for now. Sandboxes run on the machines you add
      # as hosts (kantel-host), which reach the gateway here: its local
      # address by default, so a host on this machine can join, or
      # KANTEL_PUBLIC_URL when set, for hosts elsewhere.
      # KANTEL_COMPUTE_BACKEND=stub runs them on a stand-in with no hosts.
      KANTEL_COMPUTE_BACKEND: ${KANTEL_COMPUTE_BACKEND:-}
      KANTEL_COMPUTE_PUBLIC_URL: ${KANTEL_COMPUTE_PUBLIC_URL:-${KANTEL_PUBLIC_URL:-http://127.0.0.1:${KANTEL_GATEWAY_PORT:-${HARBOUR_GATEWAY_PORT:-58090}}}}
      KANTEL_COMPUTE_IMAGES: ${KANTEL_COMPUTE_IMAGES:-}
      KANTEL_HOST_VERSION: ${KANTEL_HOST_VERSION:-}
      KANTEL_HOST_UPDATE_URL: ${KANTEL_HOST_UPDATE_URL:-}
      KANTEL_HOST_RELEASES: ${KANTEL_HOST_RELEASES:-}
      KANTEL_COMPUTE_PORTS_DOMAIN: ${KANTEL_COMPUTE_PORTS_DOMAIN:-}
      KANTEL_EGRESS_ATTRIBUTION_KEY: ${KANTEL_EGRESS_ATTRIBUTION_KEY:-}
      # Seals environments' protected values and secret files in the
      # database: 32 random bytes in base64. Left empty, protected values
      # and secret files are refused; plain variables still work.
      KANTEL_SECRETS_KEY: ${KANTEL_SECRETS_KEY:-}
      KANTEL_ACCOUNT_HOSTS: ${KANTEL_ACCOUNT_HOSTS:-}
      # `experimental` turns on read-only mounts, bundles, bucket sources and
      # signed file URLs. Bundles' tars are kept in the gatewaystate volume,
      # under /var/lib/harbour/bundles.
      KANTEL_MOUNTS: ${KANTEL_MOUNTS:-}
      # Where bundles' tars are kept instead: a path in this container, so a
      # directory elsewhere needs a volume mounted there too (a Compose
      # override). Gateways sharing one database must share it. Empty, the
      # default above.
      KANTEL_BUNDLES_DIR: ${KANTEL_BUNDLES_DIR:-}
      # `experimental` turns templates on (built microVM profiles, snapshot-cached).
      KANTEL_TEMPLATES: ${KANTEL_TEMPLATES:-}
    ports: ["127.0.0.1:${KANTEL_GATEWAY_PORT:-${HARBOUR_GATEWAY_PORT:-58090}}:8080"]
    networks: [control]
    volumes:
      - gatewaystate:/var/lib/harbour
    # A webhook or OpenTelemetry endpoint on this machine is
    # http://host.docker.internal:<port> from the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The SMTP server sign-in codes go to in compose and CI. It keeps every
  # message in memory and serves them at http://127.0.0.1:58025 (web UI and
  # API), where end-to-end tests read the codes. Never relays anything on.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${KANTEL_MAILPIT_PORT:-${HARBOUR_MAILPIT_PORT:-58025}}:8025"
      - "127.0.0.1:${KANTEL_SMTP_PORT:-${HARBOUR_SMTP_PORT:-58125}}:1025"
    networks: [control]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 2s
      retries: 30

networks:
  # As it was with the agent plane, so an upgrade keeps the network it made:
  # a fixed subnet per stack (KANTEL_CONTROL_PREFIX), dynamic addresses from
  # .128 up.
  control:
    ipam:
      config:
        - subnet: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.0/24"
          ip_range: "${KANTEL_CONTROL_PREFIX:-${HARBOUR_CONTROL_PREFIX:-10.250.89}}.128/25"

volumes:
  pgdata: {}
  gatewaystate: {}
