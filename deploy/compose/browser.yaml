# Kantel's own browsers for the gateway's sessions (packages/browser/CONTRACT.md), so a self-hosted Kantel needs no
# brwsr.dev. On top of compose.yaml:
#
#   COMPOSE_FILE=deploy/compose/compose.yaml:deploy/compose/browser.yaml docker compose up -d --build --wait
#
# - `browser-host` (apps/selfhosted/src/browser/host.ts) runs one container of images/browser per browser through the
#   Docker socket, on the `browsers` network, and keeps each browser's profile and recording on its volume, sealed with
#   KANTEL_BROWSER_SEAL_KEY. Anything holding the Docker socket is root on the machine, as with the session hosts:
#   see README.md, "Kantel's own browsers".
# - The gateway's sessions get the browser's tools, asking a person (Allow or Decline in the console) before an agent
#   opens any site. The gateway calls the host with KANTEL_BROWSER_HOST_TOKEN, and passes a viewer's live view and
#   replay (`/v1/browser/view/...`) on to it only with a valid view token, signed with KANTEL_BROWSER_VIEW_KEY, which
#   both hold.
# - The browsers reach the internet from `browsers`; nothing else is on it but the host. Only the agent's port answers,
#   and only to the host's per-start token.
#
# The keys below are development defaults. Anywhere else, set KANTEL_BROWSER_HOST_TOKEN, KANTEL_BROWSER_VIEW_KEY and
# KANTEL_BROWSER_SEAL_KEY to random values of 32 characters or more (`openssl rand -hex 32`), and KANTEL_PUBLIC_URL
# and KANTEL_EMBED_ORIGINS when an outside app frames the viewer.
services:
  # Builds the browser image, then exits. The browser host starts containers from it.
  browser-image:
    build:
      context: ../../images/browser
    image: harbour-browser:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["true"]
    restart: "no"
    network_mode: none

  browser-host:
    build:
      context: ../..
      dockerfile: apps/selfhosted/Dockerfile
    image: harbour-selfhosted:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
    command: ["bun", "src/browser/host.ts"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      KANTEL_BROWSER_HOST_TOKEN: ${KANTEL_BROWSER_HOST_TOKEN:-${HARBOUR_BROWSER_HOST_TOKEN:-dev-browser-host-token-0000000000000000}}
      KANTEL_BROWSER_VIEW_KEY: ${KANTEL_BROWSER_VIEW_KEY:-${HARBOUR_BROWSER_VIEW_KEY:-dev-browser-view-key-00000000000000000000}}
      KANTEL_BROWSER_SEAL_KEY: ${KANTEL_BROWSER_SEAL_KEY:-${HARBOUR_BROWSER_SEAL_KEY:-dev-browser-seal-key-00000000000000000000}}
      KANTEL_BROWSER_DATA_DIR: /var/lib/harbour-browser
      KANTEL_BROWSER_IMAGE: harbour-browser:${KANTEL_IMAGE_TAG:-${HARBOUR_IMAGE_TAG:-dev}}
      # Names this stack's browser containers, so its janitor removes only its own on a shared daemon.
      KANTEL_BROWSER_STACK: ${COMPOSE_PROJECT_NAME:-harbour}
      KANTEL_BROWSER_NETWORK: ${KANTEL_BROWSER_NETWORK:-${HARBOUR_BROWSER_NETWORK:-harbour-browsers}}
      KANTEL_BROWSER_RUNTIME: ${KANTEL_BROWSER_RUNTIME:-${HARBOUR_BROWSER_RUNTIME:-runc}}
      KANTEL_BROWSER_MEMORY_MB: ${KANTEL_BROWSER_MEMORY_MB:-${HARBOUR_BROWSER_MEMORY_MB:-2048}}
      KANTEL_BROWSER_CPUS: ${KANTEL_BROWSER_CPUS:-${HARBOUR_BROWSER_CPUS:-1}}
      KANTEL_BROWSER_RECORDING_DAYS: ${KANTEL_BROWSER_RECORDING_DAYS:-${HARBOUR_BROWSER_RECORDING_DAYS:-7}}
      KANTEL_BROWSER_CONSENT: ${KANTEL_BROWSER_CONSENT:-${HARBOUR_BROWSER_CONSENT:-on}}
    networks: [control, browsers]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - browserdata:/var/lib/harbour-browser
    depends_on:
      browser-image: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8790/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    environment:
      KANTEL_BROWSER_PROVIDER: harbour
      KANTEL_BROWSER_HOST_URL: http://browser-host:8790
      KANTEL_BROWSER_HOST_TOKEN: ${KANTEL_BROWSER_HOST_TOKEN:-${HARBOUR_BROWSER_HOST_TOKEN:-dev-browser-host-token-0000000000000000}}
      KANTEL_BROWSER_VIEW_KEY: ${KANTEL_BROWSER_VIEW_KEY:-${HARBOUR_BROWSER_VIEW_KEY:-dev-browser-view-key-00000000000000000000}}
      KANTEL_EMBED_ORIGINS: ${KANTEL_EMBED_ORIGINS:-${HARBOUR_EMBED_ORIGINS:-}}
      KANTEL_PUBLIC_URL: ${KANTEL_PUBLIC_URL:-${HARBOUR_PUBLIC_URL:-}}
    depends_on:
      browser-host: { condition: service_healthy }

networks:
  browsers:
    # Named outright: the host joins each browser container to it by this name.
    name: ${KANTEL_BROWSER_NETWORK:-${HARBOUR_BROWSER_NETWORK:-harbour-browsers}}

volumes:
  browserdata: {}
