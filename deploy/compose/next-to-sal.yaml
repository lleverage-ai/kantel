# The gateway on the host's own network, listening on 127.0.0.1 only. It was for a host app's worker serving the agent
# plane's sessions their host tools on a loopback port; the agent plane was removed, and with it host tools, models
# and the vault, so this now only moves the gateway onto the host's network:
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/next-to-sal.yaml up -d --build --wait
#
# The console and the compute API are then at http://127.0.0.1:58090 (KANTEL_GATEWAY_PORT). The gateway reaches
# Postgres and Mailpit through the ports compose.yaml publishes on 127.0.0.1.
#
# Projects: the bootstrap makes one project per name in KANTEL_PROJECTS (comma-separated; none by default), once, and
# puts every one on its operator key. The bootstrap file names their IDs with the organisation's:
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/next-to-sal.yaml exec -T gateway \
#     cat /var/lib/harbour/bootstrap.json | jq '{organisationId, projects}'

services:
  gateway:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      HOST: 127.0.0.1
      PORT: ${KANTEL_GATEWAY_PORT:-${HARBOUR_GATEWAY_PORT:-58090}}
      KANTEL_DATABASE_URL: postgres://harbour:harbour@127.0.0.1:${KANTEL_PG_PORT:-${HARBOUR_PG_PORT:-55432}}/harbour
      KANTEL_SMTP_URL: ${KANTEL_SMTP_URL:-${HARBOUR_SMTP_URL:-smtp://127.0.0.1:${KANTEL_SMTP_PORT:-58125}}?starttls=off}
      KANTEL_PROJECTS: ${KANTEL_PROJECTS:-${HARBOUR_PROJECTS:-}}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:' + process.env.PORT + '/healthz'); process.exit(r.ok ? 0 : 1)",
        ]
