name: Cloudflare deploy (M1-CF1)

# Deploys apps/cloudflare (the `harbour` Worker: console and gateway on one hostname, behind Cloudflare Access) from
# main, issue #17. Only main.yml deploys, calling this with `deploy: true` once CI with the tests, self-hosted and
# Sandbox image have passed on the same main commit. It only deploys once Tom's setup runbook has created the secret
# and every variable below; until then, and on any other run (`gh workflow run cloudflare-deploy.yml --ref <branch>`
# for a pull request that changes the Worker), it builds the Worker and runs `wrangler deploy --dry-run`, which never
# contacts Cloudflare.
#
# Read from the repository (#17, Account setup):
#   secret   CLOUDFLARE_API_TOKEN
#   vars     CLOUDFLARE_ACCOUNT_ID, HARBOUR_HOSTNAME, HARBOUR_ACCESS_TEAM_DOMAIN, HARBOUR_ACCESS_AUD,
#            HARBOUR_MODELS_VPC_SERVICE_ID, HARBOUR_ADMIN_EMAIL (the first admin, invited by email)
#   optional vars, only to move the data (apps/cloudflare/scripts/deploy-config.ts); unset, wrangler.jsonc's stand:
#            HARBOUR_D1_DATABASE_NAME with HARBOUR_D1_DATABASE_ID (another D1 database for DB),
#            HARBOUR_R2_BUCKET (another bucket for WORKSPACES), HARBOUR_LOCATION_HINT (the objects' hint)
#   optional secrets, each set on the Worker as a secret of the same name when it exists (src/vault.ts):
#            HARBOUR_VAULT_KEY (without it the vault answers 503), HARBOUR_VAULT_MODEL_GATEWAY_TOKEN,
#            HARBOUR_VAULT_EGRESS_GATEWAY_TOKEN, HARBOUR_CPA_API_KEY, HARBOUR_BRWSR_API_KEY (src/browser.ts: without it
#            sessions have no browser)
#
# The token's permissions (apps/cloudflare/README.md explains each):
#   Account  Workers Scripts: Edit            deploy the Worker, its Durable Objects and static assets
#   Account  D1: Edit                         find the `harbour-weur` database by name (create it if missing)
#   Account  Workers R2 Storage: Edit         find the `harbour-workspaces-weur` bucket by name (create it if missing)
#   Account  Connectivity Directory: Bind     bind the Workers VPC service to CLIProxyAPI
#   Zone     Workers Routes: Edit (myslop.app)  add the zone route HARBOUR_HOSTNAME/*
#
# A deploy finds the D1 database and R2 bucket by name, and creates one that's missing (wrangler's automatic
# provisioning). A dry run creates nothing.

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy, not only dry run (main.yml, once main's checks have passed)
        type: boolean
        default: false
  workflow_dispatch: {}

# One run per branch at a time, never cancelled half way: a newer one waits, and replaces any that is still pending.
# The name differs from main.yml's group, which would deadlock.
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, dry run, and deploy when set up
    # Harbour's own runner on Sal's host (sal-harbour-1): GitHub-hosted runners stopped at the Actions budget.
    runs-on: [self-hosted, harbour]
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      # Non-secret IDs. Empty until the runbook sets them.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HARBOUR_HOSTNAME: ${{ vars.HARBOUR_HOSTNAME }}
      HARBOUR_ACCESS_TEAM_DOMAIN: ${{ vars.HARBOUR_ACCESS_TEAM_DOMAIN }}
      HARBOUR_ACCESS_AUD: ${{ vars.HARBOUR_ACCESS_AUD }}
      HARBOUR_MODELS_VPC_SERVICE_ID: ${{ vars.HARBOUR_MODELS_VPC_SERVICE_ID }}
      HARBOUR_ADMIN_EMAIL: ${{ vars.HARBOUR_ADMIN_EMAIL }}
      # Optional: where the data lives. Empty keeps wrangler.jsonc's database, bucket and hint.
      HARBOUR_D1_DATABASE_NAME: ${{ vars.HARBOUR_D1_DATABASE_NAME }}
      HARBOUR_D1_DATABASE_ID: ${{ vars.HARBOUR_D1_DATABASE_ID }}
      HARBOUR_R2_BUCKET: ${{ vars.HARBOUR_R2_BUCKET }}
      HARBOUR_LOCATION_HINT: ${{ vars.HARBOUR_LOCATION_HINT }}
    steps:
      - uses: actions/checkout@v4

      # Deploy only from main.yml on main, and only once the secret and every variable exist.
      # The token itself reaches only the deploy step; this step learns whether it is set, nothing more.
      - name: Deploy or dry run
        id: mode
        env:
          DEPLOY: ${{ inputs.deploy == true }}
          REF: ${{ github.ref }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = "true" ] || missing+=("CLOUDFLARE_API_TOKEN (secret)")
          for name in CLOUDFLARE_ACCOUNT_ID HARBOUR_HOSTNAME HARBOUR_ACCESS_TEAM_DOMAIN HARBOUR_ACCESS_AUD \
            HARBOUR_MODELS_VPC_SERVICE_ID HARBOUR_ADMIN_EMAIL; do
            value="${!name}"
            [ -n "${value//[[:space:]]/}" ] || missing+=("$name")
          done
          if [ "$DEPLOY" != "true" ]; then
            mode=dry-run; why="only main.yml deploys, once main's checks pass"
          elif [ "$REF" != "refs/heads/main" ]; then
            mode=dry-run; why="only main deploys"
          elif [ "${#missing[@]}" -gt 0 ]; then
            mode=dry-run; why="not set up yet, missing: ${missing[*]}"
            # Some set but not all is most likely a runbook step that didn't finish.
            if [ "${#missing[@]}" -lt 7 ]; then echo "::warning::Partly set up; still missing: ${missing[*]}"; fi
          else
            mode=deploy; why="the secret and every variable are set"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode ($why)"
          echo "**Cloudflare deploy:** $mode ($why)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from corepack at the version pinned in package.json's packageManager field, as in ci.yml.
      - name: Enable corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version

      # No actions/cache: the self-hosted runner's pnpm store persists between jobs (see ci.yml).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the console
        run: pnpm --filter @harbour/cloudflare build:console

      # The dynamic-worker isolate's code, which the Worker imports as text for the Worker Loader (src/dynamic-worker.ts).
      - name: Build the dynamic-worker isolate
        run: pnpm --filter @harbour/cloudflare build:isolate

      # Placeholders stand in for unset variables in a dry run; deploy mode refuses to write a config without them.
      - name: Write the deploy config
        working-directory: apps/cloudflare
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/deploy-config.ts --mode "$MODE"

      # The vault's Worker secrets, from the repository secrets of the same names: each one only if it is set, checked
      # first. Wrangler's secrets file is additive, so one left out keeps its value on the Worker.
      - name: Write the vault secrets
        id: vault-secrets
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        env:
          HARBOUR_VAULT_KEY: ${{ secrets.HARBOUR_VAULT_KEY }}
          HARBOUR_VAULT_MODEL_GATEWAY_TOKEN: ${{ secrets.HARBOUR_VAULT_MODEL_GATEWAY_TOKEN }}
          HARBOUR_VAULT_EGRESS_GATEWAY_TOKEN: ${{ secrets.HARBOUR_VAULT_EGRESS_GATEWAY_TOKEN }}
          # CLIProxyAPI's client key: the vault object keeps it as the model gateway's platform item (src/models.ts).
          HARBOUR_CPA_API_KEY: ${{ secrets.HARBOUR_CPA_API_KEY }}
          # brwsr's project key: only the browser provider holds it (src/browser.ts).
          HARBOUR_BRWSR_API_KEY: ${{ secrets.HARBOUR_BRWSR_API_KEY }}
        run: node scripts/vault-secrets.ts --out "$RUNNER_TEMP/harbour-vault-secrets.json"

      # Always, before a real deploy too: bundles the Worker and checks the config without contacting Cloudflare.
      - name: wrangler deploy --dry-run
        working-directory: apps/cloudflare
        run: pnpm exec wrangler deploy --dry-run --config wrangler.deploy.json --outdir dist

      - name: wrangler deploy
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRETS_FILE: ${{ steps.vault-secrets.outputs.file }}
        run: |
          if [ -n "$SECRETS_FILE" ]; then
            pnpm exec wrangler deploy --config wrangler.deploy.json --secrets-file "$SECRETS_FILE"
          else
            pnpm exec wrangler deploy --config wrangler.deploy.json
          fi

      - name: Remove the vault secrets file
        if: always() && steps.vault-secrets.outputs.file != ''
        env:
          SECRETS_FILE: ${{ steps.vault-secrets.outputs.file }}
        run: rm -f "$SECRETS_FILE"

      # An anonymous visitor must be sent to Access sign-in on every path, or the deploy fails.
      - name: Anonymous requests go to Access sign-in
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        run: >
          node scripts/check-access.ts
          --host "$HARBOUR_HOSTNAME"
          --team-domain "$HARBOUR_ACCESS_TEAM_DOMAIN"
          --timeout 300

      - name: Deployed
        if: steps.mode.outputs.mode == 'deploy'
        run: echo "Deployed to https://$HARBOUR_HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
