name: Cloudflare deploy

# Deploys apps/cloudflare (the `harbour` Worker: console and gateway on one hostname, behind Cloudflare Access) from
# main, issue #17. Only main.yml deploys, calling this with `deploy: true` once CI with the tests, self-hosted and
# Sandbox image have passed on the same main commit. It only deploys once the setup runbook has created the secret
# and every variable below; until then, and on any other run (`gh workflow run cloudflare-deploy.yml --ref <branch>`
# for a pull request that changes the Worker), it builds the Worker and runs `wrangler deploy --dry-run`, which never
# contacts Cloudflare.
#
# Read from the repository (#17, Account setup):
#   secret   CLOUDFLARE_API_TOKEN
#   vars     CLOUDFLARE_ACCOUNT_ID, KANTEL_HOSTNAME, KANTEL_ACCESS_TEAM_DOMAIN, KANTEL_ACCESS_AUD,
#            KANTEL_MODELS_VPC_SERVICE_ID, KANTEL_ADMIN_EMAIL (the first admin, invited by email)
#   optional vars, only to move the data (apps/cloudflare/scripts/deploy-config.ts); unset, wrangler.jsonc's stand:
#            KANTEL_D1_DATABASE_NAME with KANTEL_D1_DATABASE_ID (another D1 database for DB),
#            KANTEL_R2_BUCKET (another bucket for WORKSPACES), KANTEL_LOCATION_HINT (the objects' hint)
#   optional var KANTEL_CONNECTIONS_PERSONAL: `on` for a deployment with one person, whose personal connections then
#            work in all their sessions; unset, a session is seen by its project (src/connections.ts)
#   optional var KANTEL_CONNECTIONS_CIMD: `on` once a Cloudflare Access Bypass covers only
#            /v1/connections/oauth/client-metadata.json, so authorisation servers can fetch the deployment's client ID
#            metadata document and CIMD is tried before DCR (#338); unset, CIMD is never offered
#   optional var KANTEL_OAUTH_CLIENTS: the deployment's own OAuth clients as JSON, such as a public GitHub client for
#            the device flow (src/connections.ts); a confidential client's secret is a Worker secret, never in the var
#   optional var KANTEL_COMPUTE_PORTS_DOMAIN: the domain sandboxes' port URLs are under (src/config.ts), routed to the
#            Worker as *.{domain}/* (its wildcard DNS record is added once outside the deploy, README "Exposed
#            ports"); unset, the Worker's default, kantel.run, Kantel's hosted ports domain, with no route
#   optional vars KANTEL_PUBLIC_URL with KANTEL_SIGN_IN_FROM (and KANTEL_SIGN_IN_DAILY_CAP, default 100): email-code
#            sign-in and open sign-up on a public origin with no Access in front, such as https://app.kantel.dev, sending
#            from an address on a domain onboarded for Cloudflare Email Sending (the SIGN_IN_MAIL binding). The origin's
#            custom domain is attached once outside this workflow (apps/cloudflare/README.md, "The public origin")
#   optional var KANTEL_ACCOUNT_HOSTS: `experimental` lets people add machines of their own, which dial out to
#            KANTEL_PUBLIC_URL and run only their account's sandboxes; unset or `off`, it stays off. Set either way,
#            KANTEL_PUBLIC_URL may go without KANTEL_SIGN_IN_FROM, leaving email sign-in off
#   optional secrets, each set on the Worker as a secret of the same name when it exists (src/vault.ts):
#            KANTEL_VAULT_KEY (without it the vault answers 503), KANTEL_VAULT_MODEL_GATEWAY_TOKEN,
#            KANTEL_VAULT_EGRESS_GATEWAY_TOKEN, KANTEL_CPA_API_KEY, KANTEL_BRWSR_API_KEY (src/browser.ts: without it
#            sessions have no browser)
#   optional secrets KANTEL_GITHUB_CLIENT_ID with KANTEL_GITHUB_CLIENT_SECRET, and KANTEL_GOOGLE_CLIENT_ID with
#            KANTEL_GOOGLE_CLIENT_SECRET: sign-in with GitHub and with Google on KANTEL_PUBLIC_URL (with email sign-in
#            on), each set on the Worker as a secret of the same name. Each pair goes together or the run fails; unset,
#            the provider stays off (apps/cloudflare/README.md, "Sign in with GitHub and Google")
#
# The token's permissions (apps/cloudflare/README.md explains each):
#   Account  Workers Scripts: Edit            deploy the Worker, its Durable Objects and static assets
#   Account  D1: Edit                         find the `harbour-weur` database by name (create it if missing)
#   Account  Workers R2 Storage: Edit         find the `harbour-workspaces-weur` bucket by name (create it if missing)
#   Account  Connectivity Directory: Bind     bind the Workers VPC service to CLIProxyAPI
#   Zone     Workers Routes: Edit (myslop.app)  add the zone route KANTEL_HOSTNAME/*
#
# A deploy finds the D1 database and R2 bucket by name, and creates one that's missing (wrangler's automatic
# provisioning). A dry run creates nothing.

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy, not only dry run (main.yml, once main's checks have passed)
        type: boolean
        default: false
  workflow_dispatch: {}

# One run per branch at a time, never cancelled half way: a newer one waits, and replaces any that is still pending.
# The name differs from main.yml's group, which would deadlock.
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, dry run, and deploy when set up
    # Kantel's own self-hosted runner: GitHub-hosted runners stopped at the Actions budget.
    runs-on: [self-hosted, harbour]
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      # Non-secret IDs. Empty until the runbook sets them.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KANTEL_HOSTNAME: ${{ (vars.KANTEL_HOSTNAME || vars.HARBOUR_HOSTNAME) }}
      KANTEL_ACCESS_TEAM_DOMAIN: ${{ (vars.KANTEL_ACCESS_TEAM_DOMAIN || vars.HARBOUR_ACCESS_TEAM_DOMAIN) }}
      KANTEL_ACCESS_AUD: ${{ (vars.KANTEL_ACCESS_AUD || vars.HARBOUR_ACCESS_AUD) }}
      KANTEL_MODELS_VPC_SERVICE_ID: ${{ (vars.KANTEL_MODELS_VPC_SERVICE_ID || vars.HARBOUR_MODELS_VPC_SERVICE_ID) }}
      KANTEL_ADMIN_EMAIL: ${{ (vars.KANTEL_ADMIN_EMAIL || vars.HARBOUR_ADMIN_EMAIL) }}
      # Optional: where the data lives. Empty keeps wrangler.jsonc's database, bucket and hint.
      KANTEL_D1_DATABASE_NAME: ${{ (vars.KANTEL_D1_DATABASE_NAME || vars.HARBOUR_D1_DATABASE_NAME) }}
      KANTEL_D1_DATABASE_ID: ${{ (vars.KANTEL_D1_DATABASE_ID || vars.HARBOUR_D1_DATABASE_ID) }}
      KANTEL_R2_BUCKET: ${{ (vars.KANTEL_R2_BUCKET || vars.HARBOUR_R2_BUCKET) }}
      KANTEL_LOCATION_HINT: ${{ (vars.KANTEL_LOCATION_HINT || vars.HARBOUR_LOCATION_HINT) }}
      # Optional: Kantel's own browsers. `on` deploys their container app; the provider is `brwsr` unless set to `kantel`.
      KANTEL_BROWSER_CONTAINERS: ${{ (vars.KANTEL_BROWSER_CONTAINERS || vars.HARBOUR_BROWSER_CONTAINERS) }}
      KANTEL_BROWSER_PROVIDER: ${{ (vars.KANTEL_BROWSER_PROVIDER || vars.HARBOUR_BROWSER_PROVIDER) }}
      # Optional: the container tier. `on` deploys the sandbox containers' app (images/sandbox) and lets commands escalate.
      KANTEL_SANDBOX_CONTAINERS: ${{ (vars.KANTEL_SANDBOX_CONTAINERS || vars.HARBOUR_SANDBOX_CONTAINERS) }}
      # Optional: the origins (a host app's) that may frame a browser's embed page, besides the console.
      KANTEL_EMBED_ORIGINS: ${{ (vars.KANTEL_EMBED_ORIGINS || vars.HARBOUR_EMBED_ORIGINS) }}
      # Optional: `on` for a deployment with one person, so their personal connections work in all their sessions.
      KANTEL_CONNECTIONS_PERSONAL: ${{ (vars.KANTEL_CONNECTIONS_PERSONAL || vars.HARBOUR_CONNECTIONS_PERSONAL) }}
      # Optional: `on` once Access bypasses the client ID metadata document's path, so CIMD is offered (#338).
      KANTEL_CONNECTIONS_CIMD: ${{ (vars.KANTEL_CONNECTIONS_CIMD || vars.HARBOUR_CONNECTIONS_CIMD) }}
      # Optional: the deployment's own OAuth clients (JSON), such as a public GitHub client for signing in with a code.
      KANTEL_OAUTH_CLIENTS: ${{ (vars.KANTEL_OAUTH_CLIENTS || vars.HARBOUR_OAUTH_CLIENTS) }}
      # Optional: the domain port URLs are under (kantel.run for Kantel's own), routed to the Worker when set.
      KANTEL_COMPUTE_PORTS_DOMAIN: ${{ vars.KANTEL_COMPUTE_PORTS_DOMAIN }}
      # Optional: email-code sign-in and open sign-up on the public origin, and the address its mail comes from.
      KANTEL_PUBLIC_URL: ${{ vars.KANTEL_PUBLIC_URL }}
      KANTEL_SIGN_IN_FROM: ${{ vars.KANTEL_SIGN_IN_FROM }}
      KANTEL_SIGN_IN_DAILY_CAP: ${{ vars.KANTEL_SIGN_IN_DAILY_CAP }}
      # Optional, experimental: accounts' own hosts, dialling KANTEL_PUBLIC_URL.
      KANTEL_ACCOUNT_HOSTS: ${{ vars.KANTEL_ACCOUNT_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      # Deploy only from main.yml on main, and only once the secret and every variable exist.
      # The token itself reaches only the deploy step; this step learns whether it is set, nothing more.
      - name: Deploy or dry run
        id: mode
        env:
          DEPLOY: ${{ inputs.deploy == true }}
          REF: ${{ github.ref }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = "true" ] || missing+=("CLOUDFLARE_API_TOKEN (secret)")
          for name in CLOUDFLARE_ACCOUNT_ID KANTEL_HOSTNAME KANTEL_ACCESS_TEAM_DOMAIN KANTEL_ACCESS_AUD \
            KANTEL_MODELS_VPC_SERVICE_ID KANTEL_ADMIN_EMAIL; do
            value="${!name}"
            [ -n "${value//[[:space:]]/}" ] || missing+=("$name")
          done
          if [ "$DEPLOY" != "true" ]; then
            mode=dry-run; why="only main.yml deploys, once main's checks pass"
          elif [ "$REF" != "refs/heads/main" ]; then
            mode=dry-run; why="only main deploys"
          elif [ "${#missing[@]}" -gt 0 ]; then
            mode=dry-run; why="not set up yet, missing: ${missing[*]}"
            # Some set but not all is most likely a runbook step that didn't finish.
            if [ "${#missing[@]}" -lt 7 ]; then echo "::warning::Partly set up; still missing: ${missing[*]}"; fi
          else
            mode=deploy; why="the secret and every variable are set"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode ($why)"
          echo "**Cloudflare deploy:** $mode ($why)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from corepack at the version pinned in package.json's packageManager field, as in ci.yml.
      - name: Enable corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version

      # No actions/cache: the self-hosted runner's pnpm store persists between jobs (see ci.yml).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the console
        run: pnpm --filter @kantel/cloudflare build:console

      # Placeholders stand in for unset variables in a dry run; deploy mode refuses to write a config without them.
      - name: Write the deploy config
        working-directory: apps/cloudflare
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/deploy-config.ts --mode "$MODE"

      # The vault's Worker secrets, from the repository secrets of the same names: each one only if it is set, checked
      # first. Wrangler's secrets file is additive, so one left out keeps its value on the Worker.
      - name: Write the vault secrets
        id: vault-secrets
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        env:
          KANTEL_VAULT_KEY: ${{ (secrets.KANTEL_VAULT_KEY || secrets.HARBOUR_VAULT_KEY) }}
          KANTEL_VAULT_MODEL_GATEWAY_TOKEN: ${{ (secrets.KANTEL_VAULT_MODEL_GATEWAY_TOKEN || secrets.HARBOUR_VAULT_MODEL_GATEWAY_TOKEN) }}
          KANTEL_VAULT_EGRESS_GATEWAY_TOKEN: ${{ (secrets.KANTEL_VAULT_EGRESS_GATEWAY_TOKEN || secrets.HARBOUR_VAULT_EGRESS_GATEWAY_TOKEN) }}
          # CLIProxyAPI's client key: the vault object keeps it as the model gateway's platform item (src/models.ts).
          KANTEL_CPA_API_KEY: ${{ (secrets.KANTEL_CPA_API_KEY || secrets.HARBOUR_CPA_API_KEY) }}
          # brwsr's project key: only the browser provider holds it (src/browser.ts).
          KANTEL_BRWSR_API_KEY: ${{ (secrets.KANTEL_BRWSR_API_KEY || secrets.HARBOUR_BRWSR_API_KEY) }}
          # Kantel's own browsers: view links' signing key and the key their profiles and recordings are sealed with.
          KANTEL_BROWSER_VIEW_KEY: ${{ (secrets.KANTEL_BROWSER_VIEW_KEY || secrets.HARBOUR_BROWSER_VIEW_KEY) }}
          KANTEL_BROWSER_SEAL_KEY: ${{ (secrets.KANTEL_BROWSER_SEAL_KEY || secrets.HARBOUR_BROWSER_SEAL_KEY) }}
          # Sign-in with GitHub and Google on the public origin: each provider's OAuth client (@kantel/identity/oauth).
          KANTEL_GITHUB_CLIENT_ID: ${{ secrets.KANTEL_GITHUB_CLIENT_ID }}
          KANTEL_GITHUB_CLIENT_SECRET: ${{ secrets.KANTEL_GITHUB_CLIENT_SECRET }}
          KANTEL_GOOGLE_CLIENT_ID: ${{ secrets.KANTEL_GOOGLE_CLIENT_ID }}
          KANTEL_GOOGLE_CLIENT_SECRET: ${{ secrets.KANTEL_GOOGLE_CLIENT_SECRET }}
        run: node scripts/vault-secrets.ts --out "$RUNNER_TEMP/harbour-vault-secrets.json"

      # Always, before a real deploy too: bundles the Worker and checks the config without contacting Cloudflare.
      - name: wrangler deploy --dry-run
        working-directory: apps/cloudflare
        run: pnpm exec wrangler deploy --dry-run --config wrangler.deploy.json --outdir dist

      - name: wrangler deploy
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRETS_FILE: ${{ steps.vault-secrets.outputs.file }}
        run: |
          if [ -n "$SECRETS_FILE" ]; then
            pnpm exec wrangler deploy --config wrangler.deploy.json --secrets-file "$SECRETS_FILE"
          else
            pnpm exec wrangler deploy --config wrangler.deploy.json
          fi

      # Kantel's own browsers keep recordings 7 days (KANTEL_BROWSER_RECORDING_DAYS' default): a replay link past that is
      # refused, and this rule deletes them a day later. Only recordings: contexts' profiles under browser/contexts/ stay.
      # Added once; a later deploy finds it by name.
      - name: Browser recordings expire
        if: steps.mode.outputs.mode == 'deploy' && env.KANTEL_BROWSER_CONTAINERS == 'on'
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bucket=$(node -e 'console.log(require("./wrangler.deploy.json").r2_buckets[0].bucket_name)')
          if pnpm exec wrangler r2 bucket lifecycle list "$bucket" | grep -q harbour-browser-recordings; then
            echo "The recordings' rule is on $bucket already"
          else
            pnpm exec wrangler r2 bucket lifecycle add "$bucket" harbour-browser-recordings browser/recordings/ \
              --expire-days 8 --force
          fi

      - name: Remove the vault secrets file
        if: always() && steps.vault-secrets.outputs.file != ''
        env:
          SECRETS_FILE: ${{ steps.vault-secrets.outputs.file }}
        run: rm -f "$SECRETS_FILE"

      # An anonymous visitor must be sent to Access sign-in on every path, or the deploy fails.
      - name: Anonymous requests go to Access sign-in
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: apps/cloudflare
        run: >
          node scripts/check-access.ts
          --host "$KANTEL_HOSTNAME"
          --team-domain "$KANTEL_ACCESS_TEAM_DOMAIN"
          --timeout 300

      - name: Deployed
        if: steps.mode.outputs.mode == 'deploy'
        run: echo "Deployed to https://$KANTEL_HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
