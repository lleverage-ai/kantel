name: Release

# Releases Kantel, everything at one version, on a GitHub Release tagged v<version>, each file with a build
# provenance attestation: `kantel-host` for Linux x86_64 and arm64 (apps/host), the user CLI `kantel-<os>-<arch>` and
# the operator CLI `kantel-admin-<os>-<arch>` for Linux and macOS on x86_64 and arm64 (apps/cli), all static Go
# binaries, the host installer `install.sh` (apps/host/install.sh), the CLIs' installer `install-cli.sh`
# (apps/cli/install-cli.sh) and `SHA256SUMS`. tools/release/README.md says why, and how to check a release.
#
# npm publishing is disabled: the npm package was the Node.js CLI, and the CLI is a Go binary now. The `dry-run` and
# `publish` jobs below (tools/release/publish.sh) are kept, switched off with `if: false`, until there is an npm
# package for the binaries; turning them back on needs pack.sh to build one into out/npm again.
#
# - A release is a run by hand on main: `gh workflow run release.yml --ref main -f version=0.1.0 -f publish=true`.
#   A version without a prerelease part becomes the latest GitHub Release, which the host join command
#   (releases/latest/download/install.sh) and the CLIs' installer (releases/latest/download/install-cli.sh) install.
#   A prerelease (0.2.0-rc.1) is a GitHub prerelease, never the latest. A run that stopped part way can be run again
#   with the same version: what is out already is skipped. `kantel update` and the CLI's update notice follow
#   releases/latest.
# - Without `publish`, and on a pull request that touches what it releases, it builds and smoke-tests everything and
#   prints the GitHub Release it would make, uploading nothing.
# - (Disabled) npm: `kantel` too, after the GitHub Release, as npm's `latest` (a prerelease as `next`). Trusted
#   publishing (OIDC), so there is no npm token and npm adds provenance. `kantel`'s trusted publisher names this file
#   and the `npm` environment, which only main may use.
# - GitHub-hosted runners, unlike the rest of Kantel's CI: trusted publishing doesn't support self-hosted runners.
#   The repository is public, so they cost no Actions minutes.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - apps/host/**
      - apps/cli/**
  workflow_dispatch:
    inputs:
      version:
        description: The release's version, such as 0.1.0 or 0.2.0-rc.1 (tagged v<version>)
        required: true
        type: string
      publish:
        description: Make the GitHub Release (off, it builds, checks and dry-runs)
        type: boolean
        default: false

# One release at a time; a re-push cancels a pull request's older dry run.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # A pull request's dry run builds a version that can't be on npm or GitHub.
  VERSION: ${{ inputs.version || format('0.0.0-pr.{0}.{1}', github.event.pull_request.number, github.run_attempt) }}
  # Trusted publishing needs npm 11.5.1 or later.
  NPM_VERSION: 11.21.1

jobs:
  pack:
    name: Build, pack and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail now rather than build for nothing: the release jobs only run on main.
      - name: A release runs on main
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releasing runs on main only; this run is on $GITHUB_REF. Run it with --ref main."
          exit 1

      - uses: actions/checkout@v7

      # Everything the release ships is Go: kantel-host (apps/host) and kantel and kantel-admin (apps/cli), which
      # need the same Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/host/go.sum

      - name: Build and pack
        run: tools/release/pack.sh "$VERSION" "$RUNNER_TEMP/release"

      - name: Smoke-test
        run: tools/release/smoke.sh "$VERSION" "$RUNNER_TEMP/release"

      - name: The GitHub Release it would make
        run: tools/release/github-release.sh --dry-run "$VERSION" "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  # Disabled with npm publishing (see the top): pack.sh builds no npm package now.
  dry-run:
    name: npm publish --dry-run
    needs: pack
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install --global "npm@$NPM_VERSION"

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - run: tools/release/publish.sh --dry-run "$RUNNER_TEMP/release"

  github-release:
    name: GitHub Release
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
      id-token: write # the attestations' signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # One build provenance attestation per file in SHA256SUMS: `gh attestation verify <file> --repo <repo>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/release/github/SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/github-release.sh "$VERSION" "$RUNNER_TEMP/release"
          echo "Released https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >>"$GITHUB_STEP_SUMMARY"

      # Tells the hosted control plane the release is out, so its console offers hosts the update now rather than
      # within the hour. It reads GitHub's latest release itself; the call names no version. Never fails the release:
      # without the KANTEL_RELEASE_CHECK_TOKEN secret, or when the control plane can't be reached, it warns.
      - name: Tell the control plane
        continue-on-error: true
        # Two minutes for GitHub to name the release, then three tries 35 seconds apart, 30 seconds each at most.
        timeout-minutes: 6
        env:
          KANTEL_RELEASE_CHECK_TOKEN: ${{ secrets.KANTEL_RELEASE_CHECK_TOKEN }}
          KANTEL_CONTROL_PLANE_URL: ${{ vars.KANTEL_PUBLIC_URL || 'https://app.kantel.dev' }}
        run: tools/release/check-control-plane.sh "$VERSION"

  publish:
    name: Publish to npm
    # After the GitHub Release, so `kantel`'s version is never out before the hosts' files.
    needs: [pack, github-release]
    # Disabled (see the top): pack.sh builds no npm package now. It was:
    # github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_npm && github.ref == 'refs/heads/main'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # kantel's trusted publisher requires this environment, and it only allows main.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global "npm@$NPM_VERSION"

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Publish
        run: tools/release/publish.sh "$RUNNER_TEMP/release"

      - name: Summary
        run: echo "Published https://www.npmjs.com/package/kantel/v/$VERSION" >>"$GITHUB_STEP_SUMMARY"
