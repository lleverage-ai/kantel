name: Main

# The release pipeline: Harbour has no tags or releases, so a push to main is the release and deploys to Cloudflare.
# Pull requests are gated only on CI's install, typecheck and lint (ci.yml), so they move quickly on the two
# self-hosted runners. The heavy checks run here once, on main's newest head: CI with the tests, the self-hosted stack
# and the sandbox image, side by side. The Cloudflare deploy needs all three to pass on this same commit; if any fails
# or is cancelled, nothing deploys and the commit shows the failing check. A run by hand on main (`gh workflow run
# main.yml --ref main`) is the way to redeploy.
on:
  push:
    branches: [main]
    # A push that only changes Markdown (READMEs, CONTRACT.md, docs/) builds and deploys nothing different, so it
    # starts no run. Nothing reads a .md file at build or test time, and Biome ignores them. Skipping the run also
    # cancels nothing: the build already going carries on, and the next code push checks the whole tree.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

# Debounced, then never starved (Tom, 30 Oct: "I don't mind the build being cancelled, but should possibly be
# throttled/debounced in some way to make sure something gets out"). Concurrency is per job, not per workflow:
# - Settle waits for main to go quiet for QUIET_SECONDS (4 minutes) after this push, so a burst of merges collapses
#   into one build. A newer push cancels a run that is still settling, which costs nothing but the wait. The wait
#   never runs past the next SLOT_SECONDS (10-minute) boundary of the clock, so a steady stream of merges, each
#   less than 4 minutes after the last, still starts a build of main's tip at least every 10 minutes. After the
#   wait, a run whose commit is no longer main's tip (and a newer push changed code, so a newer run exists) builds
#   nothing; a newer push that changed only Markdown starts no run, so it doesn't count.
# - The checks (CI, self-hosted, Sandbox image) are never cancelled once a run has settled: a newer settled run waits
#   for the running build and replaces any that is still pending. So a build that starts always finishes.
# - Each check has its group, so a newer run can replace an older run's pending check in one group while that run's
#   check in another is already running. That older run can no longer deploy, yet its running check would hold its
#   group, and the runner, for the rest of its build. So once a run has settled, it cancels every older run with a
#   check that is still pending or was cancelled. A run whose three checks have all started, or ended, is left alone.
# - The deploy is never cancelled half way either: a newer deploy waits for it, and replaces any that is still pending.
# Longest wait from a merge to its deploy, with a build of B minutes and a deploy of D: up to 10 minutes settling,
# up to B waiting for the build already running, then B and D, so about 10 + 2B + D (40 minutes at B = 14, D = 2).
# A quiet merge waits 4 + B + D (about 20). A steady stream deploys at least every max(10, B) + D minutes.
# This replaces 691013e's checks cancelled by every newer push, which starved the deploy during merge bursts (no
# deploy from 13:53 to after 16:00 UTC on 30 Oct). Earlier, PR #131's group per main run checked every merge and left
# 55 runs queued on two runners, and #221's single group let every run build and queued them all.
# The groups' names differ from the called workflows' own (`ci-`, `selfhosted-`, `sandbox-image-<run id>`,
# `cloudflare-deploy-<ref>`): a shared name would cancel or deadlock the caller.

permissions:
  contents: read

jobs:
  settle:
    name: Settle
    # One of the two runners, but only for the wait: a run that a newer push supersedes is cancelled here, before
    # the checks take both runners.
    runs-on: [self-hosted, harbour]
    timeout-minutes: 20
    permissions:
      # Write, to cancel an older run that can no longer deploy (above).
      actions: write
      contents: read
    concurrency:
      group: main-settle-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      build: ${{ steps.settle.outputs.build }}
    steps:
      - name: Wait for main to settle
        id: settle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          QUIET_SECONDS: "240"
          SLOT_SECONDS: "600"
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/$1" "${@:2}"
          }
          # A run by hand is a redeploy: it builds straight away.
          if [ "$EVENT" != "push" ]; then
            echo "A run by hand ($EVENT) builds straight away."
          else
            # From when the push made this run, not when a runner picked the job up: a job that waited for a runner
            # has already waited that long. If the API doesn't answer, from now.
            created="$(api "actions/runs/$RUN_ID" | jq -r '.created_at' || true)"
            start="$(date -d "$created" +%s 2>/dev/null || date +%s)"
            quiet=$((start + QUIET_SECONDS))
            slot=$(((start / SLOT_SECONDS + 1) * SLOT_SECONDS))
            until=$((quiet < slot ? quiet : slot))
            now="$(date +%s)"
            echo "Pushed at $(date -u -d "@$start" +%H:%M:%S); building at $(date -u -d "@$until" +%H:%M:%S) UTC unless a newer push cancels this run first."
            if [ "$until" -gt "$now" ]; then sleep $((until - now)); fi
            # A push in the last moment may not have made its run yet. If main has moved on with more than Markdown,
            # that push's run builds main instead of this one.
            tip="$(api "git/ref/heads/main" | jq -r '.object.sha' || true)"
            if [ -n "$tip" ] && [ "$tip" != "null" ] && [ "$tip" != "$SHA" ]; then
              if code="$(api "compare/$SHA...$tip" | jq -r '.files[].filename' | grep -v '\.md$')"; then
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "Main has moved on to $tip, which changes $(echo "$code" | wc -l) more files; its run builds instead."
                echo "**Settle:** superseded by $tip before building; its run builds instead." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          # Older runs that can no longer deploy: a check still pending (this run's checks replace it in a moment) or
          # already cancelled. Not one whose checks have all started or ended, nor one still settling (the settle
          # group cancels that). Best effort: if the API doesn't answer, the older run's checks just finish.
          older="$(api "actions/workflows/main.yml/runs?branch=main&per_page=30" |
            jq -r --argjson me "$RUN_ID" '.workflow_runs[] | select(.status != "completed" and .id < $me) | .id' || true)"
          for run in $older; do
            broken="$(api "actions/runs/$run/jobs?filter=latest&per_page=50" | jq -r '[.jobs[]
              | select(.name | test("^(CI|self-hosted|Sandbox image) / "))
              | select(.status == "pending" or .status == "waiting" or .conclusion == "cancelled")] | length' || true)"
            if [ "${broken:-0}" -gt 0 ]; then
              echo "Cancelling run $run: a check of it is pending or cancelled, so it can't deploy."
              api "actions/runs/$run/cancel" --request POST >/dev/null || true
            fi
          done
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "Building $SHA."

  ci:
    name: CI
    needs: settle
    if: needs.settle.outputs.build == 'true'
    concurrency:
      group: main-ci-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/ci.yml
    with:
      tests: true

  selfhosted:
    name: self-hosted
    needs: settle
    if: needs.settle.outputs.build == 'true'
    concurrency:
      group: main-selfhosted-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/selfhosted-spike.yml

  sandbox-image:
    name: Sandbox image
    needs: settle
    if: needs.settle.outputs.build == 'true'
    concurrency:
      group: main-sandbox-image-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/sandbox-image.yml

  # No `if:`, so the default success() applies: a check that failed, was skipped or was cancelled skips the deploy.
  # Never `always()` or `!cancelled()` here.
  deploy:
    name: Cloudflare deploy
    needs: [ci, selfhosted, sandbox-image]
    concurrency:
      group: main-deploy-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/cloudflare-deploy.yml
    with:
      deploy: true
    secrets: inherit
