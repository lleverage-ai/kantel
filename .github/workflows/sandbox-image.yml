name: Sandbox image

# Builds images/sandbox (the Sal worker image for the container tier, #10), checks its tools, runs the self-hosted
# container tier's Docker tests against it on gVisor, and records the image digest for the commit. Base images and
# downloads are pinned in the Dockerfile; nothing is pushed to a registry.

# Not a pull request check: main.yml calls it for main's newest head and deploys only if it passes. A pull request
# that changes the image or the container tier can run it on demand: `gh workflow run sandbox-image.yml --ref <branch>`.
on:
  workflow_call: {}
  workflow_dispatch: {}

# A second run by hand on the same branch replaces the first ("Clean up" still runs). Called from main.yml, each run
# gets a group of its own: main.yml does main's batching, and a group shared with it would deadlock.
concurrency:
  group: sandbox-image-${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Sandbox image' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build, check and record the sandbox image
    # Harbour's own runners on Sal's host (sal-harbour-1, sal-harbour-2): GitHub-hosted runners stopped at the Actions
    # budget. `gvisor` marks a runner whose Docker has the runsc and runsc-kvm runtimes; jobs use them through Docker,
    # never runsc or sudo directly. Each runner runs one job at a time for every workflow, so this job stays lean.
    runs-on: [self-hosted, harbour, gvisor]
    timeout-minutes: 30
    env:
      # This run's own tag on the host's Docker, removed in "Clean up", so runs never overwrite each other's image.
      IMAGE: harbour-sandbox:ci-${{ github.run_id }}-${{ github.run_attempt }}
      # The container tier tests label everything they create `<this>-<random>.*` (never `harbour.owner`, so a Harbour
      # stack's sandbox janitor on the host's daemon can't see it), and "Clean up" removes whatever is left with it.
      HARBOUR_TEST_LABEL_PREFIX: harbour-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # The runner's user has no buildx plugin, so install it for the user (no sudo) and build on the host daemon's own
      # BuildKit, as selfhosted-spike.yml does on its daemon. The docker driver still writes the image digest to the
      # metadata file.
      - uses: docker/setup-buildx-action@v3
        with:
          version: v0.37.2
          driver: docker

      - name: Build
        run: >
          docker buildx build images/sandbox
          --load --provenance=false
          --tag "$IMAGE"
          --metadata-file "$RUNNER_TEMP/sandbox-image.json"

      - name: Check the tools
        run: >
          docker run --rm "$IMAGE" bash -c
          'set -e; id; bun --version; node --version; pnpm --version; git --version; gh --version;
          jq --version; rg --version; python3 --version; linear-cli --version'

      # Sal's host is bare metal and its Docker already has gVisor registered as `runsc` and `runsc-kvm` (the runner's
      # user can't install anything, and needn't). The host's own stacks use `runsc-kvm`, so CI tests on that.
      - name: gVisor on the host's Docker
        run: |
          docker info --format 'runtimes: {{range $name, $_ := .Runtimes}}{{$name}} {{end}}'
          docker run --rm --runtime runsc-kvm "$IMAGE" uname -a

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile

      # On the host's daemon: the cases' containers have no network (`NetworkMode: none`) and only their own labels.
      - name: Container tier tests on gVisor
        env:
          HARBOUR_TEST_DOCKER: "1"
          HARBOUR_TEST_SANDBOX_IMAGE: ${{ env.IMAGE }}
          HARBOUR_TEST_SANDBOX_RUNTIME: runsc-kvm
        run: pnpm --filter @harbour/selfhosted-sandbox test

      - name: Record the digest
        run: |
          digest=$(node -p 'require(process.argv[1])["containerimage.digest"]' "$RUNNER_TEMP/sandbox-image.json")
          test "${digest#sha256:}" != "$digest"
          {
            echo "### Sandbox image"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- image digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"commit":"%s","digest":"%s"}\n' "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/sandbox-image.digest.json"

      # The digest is already in the job summary above, and nothing downloads this artifact. The upload counts against
      # the account's Actions artifact storage, so a full quota mustn't fail the image check.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sandbox-image-digest
          path: ${{ runner.temp }}/sandbox-image.digest.json

      # Also after a failure or a cancelled run (a re-push): the tests' own cleanup may not have run. Only this run's
      # labels and tag; the layers stay in the host's build cache for the next run.
      - name: Clean up
        if: always()
        run: |
          prefix="$HARBOUR_TEST_LABEL_PREFIX-"
          containers="$(docker ps --all --no-trunc --format '{{.ID}} {{.Labels}}' | grep -F "$prefix" | cut -d' ' -f1 || true)"
          [ -z "$containers" ] || docker rm --force --volumes $containers
          volumes="$(docker volume ls --format '{{.Name}} {{.Labels}}' | grep -F "$prefix" | cut -d' ' -f1 || true)"
          [ -z "$volumes" ] || docker volume rm $volumes
          if [ -n "$(docker image ls --quiet "$IMAGE")" ]; then docker image rm "$IMAGE"; fi
          rm -f "$RUNNER_TEMP/sandbox-image.json" "$RUNNER_TEMP/sandbox-image.digest.json"
