name: Sandbox image

# Builds images/sandbox (the Sal worker image for the container tier, #10), checks its tools, runs the self-hosted
# container tier's Docker tests against it on gVisor, and records the image digest for the commit. Base images and
# downloads are pinned in the Dockerfile; nothing is pushed to a registry.

on:
  pull_request:
    paths:
      - "images/sandbox/**"
      - "targets/selfhosted/sandbox/**"
      - "packages/sandbox/**"
      - "packages/workspace/**"
      - "packages/contracts/**"
      - "packages/testing/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/sandbox-image.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build, check and record the sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: >
          docker buildx build images/sandbox
          --load --provenance=false
          --tag harbour-sandbox:ci
          --metadata-file "$RUNNER_TEMP/sandbox-image.json"

      - name: Check the tools
        run: >
          docker run --rm harbour-sandbox:ci bash -c
          'set -e; id; bun --version; node --version; pnpm --version; git --version; gh --version;
          jq --version; rg --version; python3 --version; linear-cli --version'

      # gVisor from its apt repository; the runner has no KVM guarantee, so CI uses the default platform (`runsc`)
      # where Sal's host uses `runsc-kvm`. Both are the same sandbox; only the platform differs.
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker run --rm --runtime runsc harbour-sandbox:ci uname -a

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile

      - name: Container tier tests on gVisor
        env:
          HARBOUR_TEST_DOCKER: "1"
          HARBOUR_TEST_SANDBOX_IMAGE: harbour-sandbox:ci
          HARBOUR_TEST_SANDBOX_RUNTIME: runsc
        run: pnpm --filter @harbour/selfhosted-sandbox test

      - name: Record the digest
        run: |
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/sandbox-image.json")
          test "${digest#sha256:}" != "$digest"
          {
            echo "### Sandbox image"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- image digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"commit":"%s","digest":"%s"}\n' "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/sandbox-image.digest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-digest
          path: ${{ runner.temp }}/sandbox-image.digest.json
