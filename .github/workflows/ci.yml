name: CI

# The pull request gate, kept quick for the two self-hosted runners: install, typecheck, lint and the generated API
# files, no tests, beside the host's Go vet and unit tests (seconds) and the isolate runtime's Rust checks and tests
# (minutes from cold, less with the runner's cargo cache warm). The TypeScript tests run on main instead: main.yml calls this with `tests: true`, alongside the self-hosted
# and Sandbox image suites, and deploys only once all three pass. On a branch, `gh workflow run ci.yml --ref <branch>
# -f tests=true` runs the tests too.
on:
  pull_request:
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tests:
        description: Run the tests too
        type: boolean
        default: false

# A re-push cancels the pull request's older run, queued or running. Called from main.yml (where github.event_name is
# main.yml's) or run by hand, each run gets a group of its own: main.yml does main's batching.
concurrency:
  group: ci-${{ github.workflow == 'CI' && github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # The PR check keeps the workflow's name, `CI`, as the merge gate; the job's name says what ran.
    name: ${{ inputs.tests && 'Install, typecheck, lint and test' || 'Install, typecheck and lint' }}
    # Kantel's own self-hosted runners: GitHub-hosted runners stopped at the Actions budget.
    runs-on: [self-hosted, harbour]
    # Without the tests about a minute. With them, four test workers on a shared host take about 7 minutes;
    # GitHub-hosted took about 4.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from corepack at the version pinned in package.json's packageManager field.
      - name: Enable corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version

      # No actions/cache: the pnpm store is in the runner user's home, which persists between jobs on a self-hosted
      # runner, so it's already warm. Restoring the 250 MB cache from GitHub took about 25 s a run, and saving it 8 s
      # more, against an install of under 10 s from the local store.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The public API's OpenAPI document and TS SDK are generated from packages/api/src/routes.ts and committed. This
      # fails when they no longer match the routes; `pnpm --filter @kantel/api generate` brings them up to date.
      - name: Generated API files are current
        run: pnpm --filter @kantel/api generate:check

      # The docs site's API reference pages are generated from that OpenAPI document. This fails when they no longer
      # match it; `node docs/site/scripts/api-reference.ts` brings them up to date.
      - name: API reference pages are current
        run: node docs/site/scripts/api-reference.ts --check

      # kantel.dev (apps/site) syncs the docs into /docs as it builds and fails on any internal link that doesn't
      # resolve, so a docs page that moves breaks here rather than on the site. It has a lockfile of its own, outside
      # the workspace. About 30 s, most of it images.
      - name: kantel.dev builds and its install.sh and cli.sh parse
        run: |
          sh -n apps/site/public/install.sh
          sh -n apps/cli/install-cli.sh
          pnpm --dir apps/site install --frozen-lockfile --ignore-workspace
          pnpm --dir apps/site build

      # The runner's host has 48 cores shared with other work. Left alone, vitest starts a worker per core, and the
      # PGlite suites run past their 10 s timeout. Four workers is a GitHub-hosted runner's size, what they were tuned on.
      - name: Test
        if: inputs.tests
        env:
          VITEST_MAX_WORKERS: "4"
        run: |
          pnpm test
          pnpm -r --if-present test

  host-go:
    # The host agent and the guest agent (apps/host) are Go, outside the pnpm workspace, so the check above never
    # builds them. Vet and the unit tests take a few seconds, so they run on every pull request and on main, whatever
    # changed: a check that's meant to be required can't be skipped by a path filter. The VM tests (the `vmtest` tag,
    # apps/host/test/) need KVM and stay out of it.
    name: Go vet and test (apps/host)
    runs-on: [self-hosted, harbour]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/host/go.mod
          cache-dependency-path: apps/host/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  isolate-runtime:
    # The isolate runtime (apps/host/isolate-runtime, kantel-isolate: Rust on deno_core) is outside both: cargo fmt,
    # clippy and test, in the same Rust container the images build it in (guest/isolate-runtime.sh test), and a release
    # build for amd64 and arm64 (cross-compiled), so a change that breaks the image's build fails here. Nothing is
    # restored from GitHub's cache: on the self-hosted runners cargo's registry is a Docker volume
    # (kantel-isolate-cargo) and the build, with V8's static library (about 100 MB a target, downloaded by rusty_v8's
    # build script), a directory in the runner's home, both kept between jobs.
    #
    # V8: the sandboxed V8 build the crate pins (v8/fetch-v8-sandbox.sh, the rusty-v8-sandbox-v150.4.0-1 prerelease, x86_64 and aarch64),
    # which production images link, with the patched deno_core (v8/sandbox-crate.sh); the KANTEL_V8_SANDBOX repository
    # variable set to "0" checks the stock V8 instead. KANTEL_RUSTY_V8_ARCHIVE with KANTEL_RUSTY_V8_ARCHIVE_SHA256 picks
    # any other build; the script checks it against its SHA-256 before cargo sees it.
    name: Rust check and test (apps/host/isolate-runtime)
    runs-on: [self-hosted, harbour]
    timeout-minutes: 45
    env:
      KANTEL_ISOLATE_TARGET: ${{ github.workspace }}/../.kantel-isolate-target
      KANTEL_V8_SANDBOX: ${{ vars.KANTEL_V8_SANDBOX || '1' }}
      RUSTY_V8_ARCHIVE: ${{ vars.KANTEL_RUSTY_V8_ARCHIVE }}
      RUSTY_V8_ARCHIVE_SHA256: ${{ vars.KANTEL_RUSTY_V8_ARCHIVE_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      # The guest bundle (the shell, node and python guests) is built with Bun before cargo, since it's compiled into the
      # binary. Bun 1.4, which wrote the crate's bun.lock (1.3 can't read it). From npm rather than oven-sh/setup-bun, which needs `unzip`: the runner has no system packages to add it
      # with (as selfhosted-spike.yml does).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Bun
        run: |
          npm install --global bun@1.4.3
          bun --version

      # Until the runtime's source is in (apps/host/isolate-runtime/Cargo.toml), there is nothing to check.
      - name: Has the runtime's source
        id: crate
        run: |
          if [ -f apps/host/isolate-runtime/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Format, clippy and test
        if: steps.crate.outputs.present == 'true'
        run: apps/host/guest/isolate-runtime.sh test

      # Each with its assets (build-assets.sh), as rootfs.sh builds them for the isolate image.
      - name: Release build (amd64 and arm64)
        if: steps.crate.outputs.present == 'true'
        run: |
          apps/host/guest/isolate-runtime.sh amd64
          apps/host/guest/isolate-runtime.sh arm64

  cli-go:
    # kantel and kantel-admin (apps/cli) are Go too. The generated API client must match the OpenAPI document, and the
    # docs' command reference the command table.
    name: Go vet and test (apps/cli)
    runs-on: [self-hosted, harbour]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      - name: Generated API client is current
        run: go run ./internal/api/gen -check

      # docs/site/src/content/docs/tools/cli-reference.md, from the command table; go run ./cmd/kantel-docs writes it.
      - name: Command reference is current
        run: go run ./cmd/kantel-docs -check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
