name: CI

on:
  pull_request:
  push:
    branches: [main]

# A re-push cancels the pull request's older run, queued or running. Runs on main are never cancelled: each gets a group
# of its own, since a shared group would still cancel an older pending run when a newer one queues.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Install, typecheck, lint and test
    # Harbour's own runner on Sal's host (sal-harbour-1): GitHub-hosted runners stopped at the Actions budget.
    runs-on: [self-hosted, harbour]
    # Four test workers on a shared host take about 7 minutes; GitHub-hosted took about 4.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm comes from corepack at the version pinned in package.json's packageManager field.
      - name: Enable corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The public API's OpenAPI document and TS SDK are generated from packages/api/src/routes.ts and committed. This
      # fails when they no longer match the routes; `pnpm --filter @harbour/api generate` brings them up to date.
      - name: Generated API files are current
        run: pnpm --filter @harbour/api generate:check

      # The runner's host has 48 cores shared with other work. Left alone, vitest starts a worker per core, and the
      # PGlite suites run past their 10 s timeout. Four workers is a GitHub-hosted runner's size, what they were tuned on.
      - name: Test
        env:
          VITEST_MAX_WORKERS: "4"
        run: |
          pnpm test
          pnpm -r --if-present test
