name: self-hosted

# Not a pull request check: main.yml calls it for main's newest head and deploys only if it passes. A pull request that
# changes the stack, its image or this workflow can run it on demand: `gh workflow run selfhosted-spike.yml --ref
# <branch>`.
#
# The stack is deploy/compose/compose.yaml: the gateway (the console, the compute plane's API, identity and audit),
# Postgres and Mailpit. The checks below drive it as a deployment would: sign-in, keys, the compute plane, the bindings
# on its Postgres and Mailpit, and a restart that keeps the deployment.
on:
  workflow_call: {}
  workflow_dispatch: {}

# Two self-hosted runners run every workflow's jobs one at a time each, so a second run by hand on
# the same branch replaces the first rather than queueing behind it. "Tear down" runs on cancel too and removes the
# run's daemon. Called from main.yml, each run gets a group of its own: main.yml does main's batching, and a group
# shared with it would deadlock.
concurrency:
  group: selfhosted-${{ github.event_name == 'workflow_dispatch' && github.workflow == 'self-hosted' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  selfhosted:
    # Kantel's own self-hosted runner: GitHub-hosted runners stopped at the Actions budget.
    runs-on: [self-hosted, harbour]
    timeout-minutes: 30
    env:
      COMPOSE_FILE: deploy/compose/compose.yaml
      # The stack runs in a Docker daemon of its own (see "Start this run's Docker daemon"), not the host's.
      DIND_NAME: harbour-ci-dind-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # From npm rather than oven-sh/setup-bun, which needs `unzip`: the runner has no system packages to add it with.
      # The package installs the same release binary for the platform.
      - name: Install Bun
        run: |
          npm install --global bun@1.3.14
          bun --version

      # The workspace install (as ci.yml does it), so the self-hosted tests can import the workspace packages and
      # their conformance suites.
      - name: Install
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @kantel/selfhosted typecheck

      # The gateway's in-process tests on Bun, the runtime its image runs it on (ci.yml runs them on Node). Postgres
      # tests skip here: "Bindings against the stack" runs them on the stack's.
      - name: Gateway tests on Bun
        working-directory: apps/selfhosted
        run: bun test ./test/gateway/

      # The runner shares the host's Docker with other Kantel stacks, so this run's stack gets a Docker daemon of its
      # own, a throwaway docker:dind container (privileged, on the default bridge, never the host network), and every
      # docker and compose command below talks to it over TLS. The stack keeps compose.yaml's defaults inside it:
      # nothing it publishes reaches the host's ports, so it can't clash with the host's stacks or another run.
      #
      # The daemon starts with an empty image store, so every run pulls each base image again, and the runners share one
      # address: Docker Hub's unauthenticated pull limit stopped "Bring up the stack" with 429 toomanyrequests. The daemon
      # pulls through Google's public Docker Hub mirror (mirror.gcr.io) first, and from Docker Hub only if the mirror
      # fails.
      #
      # compose.yaml publishes on 127.0.0.1, which inside the daemon is its own loopback. One socat per published port,
      # on the daemon's network namespace, forwards the daemon's bridge address to it; the tests use that address.
      - name: Start this run's Docker daemon
        run: |
          docker run --detach --privileged --name "$DIND_NAME" \
            --env DOCKER_TLS_CERTDIR=/certs --volume /var/lib/docker \
            docker:29-dind --registry-mirror=https://mirror.gcr.io
          for _ in $(seq 1 60); do
            docker exec "$DIND_NAME" docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$DIND_NAME" docker info --format 'daemon {{.ServerVersion}}, {{.Driver}}, mirrors {{.RegistryConfig.Mirrors}}'
          ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DIND_NAME")"
          test -n "$ip"
          certs="$RUNNER_TEMP/$DIND_NAME-certs"
          docker cp "$DIND_NAME:/certs/client" "$certs"
          export DOCKER_HOST="tcp://$ip:2376" DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH="$certs"
          docker info --format 'reached {{.Name}} over TLS'
          for port in 55432 58090 58025 58125; do
            docker run --detach --network host --name "forward-$port" alpine/socat:1.8.0.3 \
              "tcp-listen:$port,fork,reuseaddr,bind=$ip" "tcp:127.0.0.1:$port"
          done
          {
            echo "DOCKER_HOST=$DOCKER_HOST"
            echo "DOCKER_TLS_VERIFY=1"
            echo "DOCKER_CERT_PATH=$certs"
            echo "STACK=$ip"
            # What the tests run outside the stack connect to.
            echo "KANTEL_DATABASE_URL=postgres://harbour:harbour@$ip:55432/harbour"
          } >> "$GITHUB_ENV"

      # Compose needs buildx to build with BuildKit; without it, it falls back to the classic builder, which ignores
      # the per-Dockerfile ignore files (apps/selfhosted/Dockerfile.dockerignore) and copies the checkout's
      # node_modules into the image. The runner's user has no buildx plugin, so install it for the user (no sudo) and
      # build on this run's daemon's own BuildKit, as on GitHub's images.
      - uses: docker/setup-buildx-action@v3
        with:
          version: v0.37.2
          driver: docker

      # As the installer does it.
      - name: Bring up the stack
        run: docker compose up -d --build --wait --remove-orphans

      # The gateway in the stack: identity, the compute plane, audit queries and the console, over HTTP behind the
      # API-key authenticator; then mail: a message sent through the gateway's KANTEL_SMTP_URL reaches Mailpit, where
      # the email one-time PIN test reads its codes (#15).
      - name: Gateway and Mailpit end to end
        run: >
          bun apps/selfhosted/test/gateway/stack.ts
          --base-url "http://$STACK:58090"
          --mailpit-url "http://$STACK:58025"

      # Each real implementation the self-hosted deployment binds (audit, identity and OTP sign-in, the gateway's
      # Postgres tables) against its contract's conformance suite, on this stack's Postgres and Mailpit. The table goes
      # to the job summary.
      - name: Bindings against the stack
        run: >
          bun apps/selfhosted/test/bindings.ts --markdown "$GITHUB_STEP_SUMMARY"
          --postgres-url "$KANTEL_DATABASE_URL"
          --smtp-url "smtp://$STACK:58125?starttls=off"
          --mailpit-url "http://$STACK:58025"

      # The gateway runs on those bindings: restarted, it must keep its deployment (the bootstrap key and the compute
      # plane's key still work).
      - name: Gateway after a restart
        run: |
          compose="docker compose"
          before=$($compose exec -T gateway cat /var/lib/harbour/bootstrap.json)
          $compose restart gateway
          $compose up -d --wait --no-deps gateway
          after=$($compose exec -T gateway cat /var/lib/harbour/bootstrap.json)
          if [ "$before" != "$after" ]; then
            echo "::error::the gateway set up a new deployment on restart instead of keeping its own"
            exit 1
          fi
          bun apps/selfhosted/test/gateway/stack.ts --base-url "http://$STACK:58090" --mailpit-url "http://$STACK:58025"

      # Only once this run's daemon is up: before that, compose would read the host's default `kantel` stack.
      - name: Logs on failure
        if: failure() && env.STACK != ''
        run: docker compose logs --no-color --timestamps --tail 300

      # On the host's daemon: removing the daemon's container and its anonymous volume removes the whole stack and its
      # images with it.
      - name: Tear down
        if: always()
        run: |
          unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          # `docker ps` lists nothing when the container is gone and fails when Docker can't be reached, so absence is
          # only ever read from an answer. Fail the job unless the daemon is confirmed gone after three tries.
          present() { docker ps --all --quiet --filter "name=^/${DIND_NAME}\$"; }
          for _ in 1 2 3; do
            if ids="$(present)"; then
              [ -z "$ids" ] && break
              docker rm --force --volumes "$DIND_NAME" || sleep 5
            else
              sleep 5
            fi
          done
          if ! ids="$(present)" || [ -n "$ids" ]; then
            echo "::error::could not confirm $DIND_NAME was removed"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/$DIND_NAME-certs"
